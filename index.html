const TITLE_RE = /(董事長|副董事長|總裁|執行長|總經理|副總經理|副總裁|副總|協理|處長|副處長|總監|經理|副理|襄理|課長|科長|股長|組長|主任|主管|特助|秘書|專員|工程師|業務代表|業務|顧問|院長|副院長|局長|副局長|主秘|技術長|財務長|營運長|廠長|董事|監事|合夥人|負責人|老闆|店長|助理|研究員|管理師|CEO|CTO|CFO|COO|CIO|President|Director|Manager|Engineer|Sales|Consultant|Specialist|Assistant|Supervisor|Chairman|Owner|VP)/i;
const ORG_RE = /(股份有限公司|有限公司|公司|企業社|企業|集團|工業|工廠|實業|商行|醫院|診所|醫療|大學|學院|學校|政府|公所|議會|基金會|協會|Co\.?,?\s*Ltd|Inc\.?|Corp\.?|Corporation|Limited|LTD|Company|Group)/i;
const DEPT_RE = /(部門|事業部|事業群|部|處|課|組|中心|室|科|Dept\.?|Department|Division)$/i;
const TITLE_ONLY_RE = /^(資深|高級|首席|副|助理|代理)?(董事長|總經理|經理|副理|協理|處長|總監|主任|課長|組長|專員|工程師|業務代表|業務經理|業務|顧問|特助|執行長|院長|局長|科長|秘書|助理|襄理|廠長|董事|副總|總裁|技術長|研究員|管理師)$/;
const SURNAMES = '陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴徐周葉蘇莊呂江何蕭羅高潘簡朱鍾游彭詹胡施沈余盧梁趙顏柯翁魏孫戴范方宋鄧杜傅侯曹薛丁卓阮馬董溫唐藍石蔣古紀姚連馮歐程湯田康姜白汪鄒尤巫鐘黎涂龔嚴韓袁金童陸夏柳凃邵錢伍倪于譚駱熊任甘秦顧毛章史官萬俞雷粘饒賀賈尹覃白';
const INDUSTRY_KW = [['半導體', /(半導體|晶圓|晶片|IC設計|封裝|封測|Semiconductor)/i], ['工具機', /(工具機|CNC|綜合加工機|車床|銑床|磨床)/i], ['醫療單位', /(醫院|診所|醫療|醫學|衛生所|Hospital|Clinic)/i], ['公部門', /(政府|市府|縣府|公所|局$|署|部會|議會|國營|公營)/],
  ['化妝品', /(化妝品|美妝|保養品|Cosmetic)/i], ['自行車', /(自行車|腳踏車|單車|Bicycle|Bike|Cycling)/i], ['塑膠射出', /(塑膠|射出|塑料|Plastic|Injection)/i], ['手工具', /(手工具|扳手|起子|鉗|Hand ?Tool)/i],
  ['建築', /(建築|建材|營造|建設|鋼構|Construction)/i], ['五金加工', /(五金|金屬加工|沖壓|螺絲|Hardware)/i], ['家居行業', /(家居|家具|傢俱|居家|寢具|衛浴|Furniture)/i], ['零售業', /(零售|百貨|超市|量販|商店|門市|Retail)/i], ['設備機械', /(機械|設備|自動化|Machinery|Equipment)/i]];

function parseCard(text) {
  const raw = String(text || '').normalize('NFKC');
  const lines = raw.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const r = { company: '', name: '', title: '', department: '', phone: '', mobile: '', fax: '', email: '', website: '', taxId: '', address: '', region: '', industry: '', rest: [] };
  const used = new Set();
  const cleanNum = s => s.replace(/[\s.]+$/, '').replace(/^[\s:：]+/, '').replace(/\s{2,}/g, ' ').trim();
  // Email
  const em = raw.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
  if (em) r.email = em[0];
  // 統一編號
  const tx = raw.match(/(?:統一編號|統編|Tax\s*ID|VAT)\s*[:：#]?\s*(\d{8})/i);
  if (tx) r.taxId = tx[1];
  // 電話類
  const ext = '(?:\\s*(?:#|ext\\.?|分機|轉)\\s*\\d{1,6})?';
  const mob = raw.match(new RegExp('(?:手機|行動|Mobile|Cell|M)\\s*[:：.]?\\s*((?:\\+?886[-\\s]?|0)9\\d{2}[-\\s]?\\d{3}[-\\s]?\\d{3})', 'i')) || raw.match(/((?:\+?886[-\s]?|0)9\d{2}[-\s]?\d{3}[-\s]?\d{3})/);
  if (mob) r.mobile = cleanNum(mob[1]);
  const fax = raw.match(/(?:傳真|FAX|F)\s*[:：.]\s*(\+?[\d()\-\s]{8,18}\d)/i) || raw.match(/(?:傳真|FAX)\s*(\+?[\d()\-\s]{8,18}\d)/i);
  if (fax) r.fax = cleanNum(fax[1]);
  const tel = raw.match(new RegExp('(?:電話|總機|專線|TEL|Phone|T)\\s*[:：.]?\\s*(\\+?[\\d()\\-\\s]{8,18}\\d' + ext + ')', 'i'));
  if (tel && !(r.mobile && tel[1].replace(/\D/g, '') === r.mobile.replace(/\D/g, ''))) r.phone = cleanNum(tel[1]);
  if (!r.phone) {
    const all = raw.match(new RegExp('(\\(?0\\d{1,2}\\)?[-\\s]?\\d{3,4}[-\\s]?\\d{4}' + ext + ')', 'g')) || [];
    const p = all.find(x => !/^\(?09/.test(x) && x.replace(/\D/g, '') !== (r.fax || '').replace(/\D/g, ''));
    if (p) r.phone = cleanNum(p);
  }
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const plain = l.replace(/\s/g, '');
    // 網址
    if (!r.website) {
      const w = l.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '').match(/((?:https?:\/\/)?(?:www\.)?[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:com|net|org|gov|edu|tw|io|co|biz|info|cn|jp|hk)(?:\.[a-z]{2})?(?:\/[^\s]*)?)/i);
      if (w && (/www\.|https?:/i.test(w[1]) || /^(網址|Web|Website|URL)/i.test(l))) { r.website = w[1]; }
    }
    // 地址
    if (!r.address && /(縣|市).{0,12}(區|鄉|鎮|市|村|里|路|街|大道|段|巷|號)/.test(plain) && /\d/.test(plain) && !/@/.test(l)) {
      r.address = l.replace(/^(地址|住址|公司地址|Add(ress)?|A)\s*[:：.]?\s*/i, '').replace(/\s*(TEL|電話|FAX|傳真).*$/i, '').trim();
      used.add(i); continue;
    }
    if (/@|(電話|TEL|FAX|傳真|手機|Mobile|統一編號|統編|網址|www\.)/i.test(l) || /^[\d\s()+\-#]+$/.test(l)) { used.add(i); continue; }
    if (!r.company && ORG_RE.test(l) && plain.length <= 40) { r.company = l.replace(/^(公司|Company)\s*[:：]\s*/i, ''); used.add(i); continue; }
  }
  // 姓名與職稱
  const cjkName = /^[一-鿿]{2,4}$/;
  const remain = lines.map((l, i) => ({ l, i })).filter(x => !used.has(x.i));
  for (const { l, i } of remain) {
    const plain = l.replace(/\s/g, '');
    if (!r.name && /^[一-鿿]{3,}/.test(plain) && SURNAMES.includes(plain[0])) {
      const cut = [3, 2, 4].find(n => plain.length > n && /^[一-鿿]+$/.test(plain.slice(0, n)) && TITLE_ONLY_RE.test(plain.slice(n)));
      if (cut) { r.name = plain.slice(0, cut); r.title = plain.slice(cut); used.add(i); continue; }
    }
    if (!r.name && cjkName.test(plain) && SURNAMES.includes(plain[0]) && !TITLE_RE.test(plain) && !DEPT_RE.test(plain) && !ORG_RE.test(plain)) { r.name = plain; used.add(i); continue; }
  }
  for (const { l, i } of remain) {
    if (used.has(i)) continue;
    const plain = l.replace(/\s/g, '');
    if (!r.title && TITLE_RE.test(l) && plain.length <= 24) {
      const parts = l.split(/\s*[\/｜|,，、]\s*|\s+/).filter(Boolean);
      const dep = parts.filter(p => DEPT_RE.test(p) && !TITLE_ONLY_RE.test(p));
      const tit = parts.filter(p => !dep.includes(p));
      if (dep.length && !r.department) r.department = dep.join(' ');
      r.title = tit.join(' ') || l; used.add(i); continue;
    }
    if (!r.department && DEPT_RE.test(plain) && plain.length <= 16 && !ORG_RE.test(plain)) { r.department = l; used.add(i); continue; }
  }
  if (!r.name) { // 英文姓名或無常見姓氏的備援
    const c = remain.find(({ l, i }) => !used.has(i) && (/^[A-Z][a-z]+(\s[A-Z][a-z]+){1,2}$/.test(l) || /^[一-鿿]{2,3}$/.test(l.replace(/\s/g, ''))));
    if (c) { r.name = /[一-鿿]/.test(c.l) ? c.l.replace(/\s+/g, '') : c.l; used.add(c.i); }
  }
  if (!r.company) { const c = remain.find(({ i, l }) => !used.has(i) && /[一-鿿]{4,}/.test(l) && !TITLE_RE.test(l)); if (c) { r.company = c.l; used.add(c.i); } }
  r.region = regionFromAddress(r.address);
  const ind = INDUSTRY_KW.find(([, re]) => re.test(r.company) || re.test(raw));
  if (ind) r.industry = ind[0];
  r.rest = lines.filter((l, i) => !used.has(i) && l !== r.company);
  return r;
}

async function detectTextFromImage(file) {
  if (!('TextDetector' in window)) return null;
  const bmp = await createImageBitmap(file);
  const det = new window.TextDetector();
  const res = await det.detect(bmp);
  return res.map(x => ({ t: x.rawValue, y: x.boundingBox.y, x: x.boundingBox.x, h: x.boundingBox.height }))
    .sort((a, b) => Math.abs(a.y - b.y) < Math.min(a.h, b.h) / 2 ? a.x - b.x : a.y - b.y).map(x => x.t).join('\n');
}

function pjStatus(k) { return PJ_STATUS.find(s => s.k === k) || PJ_STATUS[0]; }
function pjBadge(k) { const s = pjStatus(k); return `<span class="badge" style="background:${s.c}1a;color:${s.c};border-color:${s.c}55">${esc(s.t)}</span>`; }
function parseMoney(v) { const n = Number(String(v == null ? '' : v).replace(/[,\s元$NT]/g, '')); return isFinite(n) ? n : NaN; }
function nt(n) { return (n == null || n === '' || isNaN(n)) ? '' : 'NT$ ' + Math.round(Number(n)).toLocaleString('zh-TW'); }
function exTax(n) { return Math.round(Number(n || 0) / 1.05); }
function addMonths(dateStr, n) { const [y, m, d] = dateStr.split('-').map(Number); const dt = new Date(y, m - 1 + n, d); if (dt.getDate() !== d) dt.setDate(0); return todayStr(dt); }
function costTotal(p) { return (p.costs || []).reduce((s, c) => s + (Number(c.qty) || 0) * (Number(c.unitCost) || 0), 0); }
function pjGP(p) { const amt = Number(p.amount) || 0; const cost = costTotal(p); return { amt, cost, gp: amt - cost, pct: amt ? (amt - cost) / amt * 100 : null }; }
function payInfo(p) {
  const list = p.payments || [];
  const total = list.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const paid = list.filter(x => x.paidDate).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const t = todayStr();
  const overdue = list.filter(x => !x.paidDate && x.dueDate && x.dueDate < t);
  return { total, paid, unpaid: total - paid, overdue, pct: Number(p.amount) ? paid / Number(p.amount) * 100 : null };
}
function expiryClass(end) {
  if (!end) return '';
  const t = todayStr();
  if (end < t) return 'expired';
  if (end.slice(0, 7) === t.slice(0, 7)) return 'month';
  if (end <= addMonths(t, 3)) return 'm3';
  if (end <= addMonths(t, 6)) return 'm6';
  return 'later';
}
function expiryBadge(end) {
  if (!end) return '<span class="muted">—</span>';
  const c = expiryClass(end), d = daysBetween(todayStr(), end);
  if (c === 'expired') return `<span class="badge archived">已到期</span> <span class="small">${esc(end)}</span>`;
  if (c === 'month' || c === 'm3') return `<span class="badge overdue">${d} 天後到期</span> <span class="small">${esc(end)}</span>`;
  if (c === 'm6') return `<span class="badge prospect">${d} 天後到期</span> <span class="small">${esc(end)}</span>`;
  return esc(end);
}

/* ---------- 會議紀錄 → 待辦事項 解析 ---------- */
const TODO_LINE_RE = /^\s*(?:[-*•・]\s*)?(?:\[( |x|X|v|V)?\]|(☐)|(☑|✅)|(?:待辦|代辦|TODO|To ?do|Action)(?:事項)?\s*[:：])\s*(.+)$/i;
function normKey(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/[\s，,。.；;：:！!]/g, ''); }
function parseTodoDate(s, baseDate) {
  let m = s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return parseDate(`${m[1]}-${m[2]}-${m[3]}`) || '';
  m = s.match(/(?:^|[^\d])(\d{1,2})[\/](\d{1,2})(?![\d\/])/) || s.match(/(\d{1,2})月(\d{1,2})日?/);
  if (!m) return '';
  const base = baseDate || todayStr();
  let y = Number(base.slice(0, 4));
  let d = parseDate(`${y}-${m[1]}-${m[2]}`);
  if (d && d < addMonths(base, -1)) d = parseDate(`${y + 1}-${m[1]}-${m[2]}`); // 已過的月份視為明年
  return d || '';
}
function parseTodos(notes, baseDate) {
  const out = []; const seen = new Set();
  String(notes || '').split(/\r?\n/).forEach((line, i) => {
    const m = line.match(TODO_LINE_RE); if (!m) return;
    const done = !!(m[1] && m[1].trim()) || !!m[3];
    let body = m[4].trim();
    const ownerM = body.match(/@([^\s@,，、]+)/);
    const owner = ownerM ? ownerM[1] : '';
    const due = parseTodoDate(body, baseDate);
    let text = body.replace(/@[^\s@,，、]+/g, '')
      .replace(/(?:截止|期限|到期|due)?\s*[:：]?\s*(\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}|\d{1,2}\/\d{1,2}(?![\d\/])|\d{1,2}月\d{1,2}日?)\s*(前)?/gi, '')
      .replace(/[（(]\s*[)）]/g, '').replace(/\s{2,}/g, ' ').replace(/^[\s,，、\-–]+|[\s,，、\-–]+$/g, '').trim();
    if (!text) return;
    const key = normKey(text);
    if (seen.has(key)) return; seen.add(key);
    out.push({ text, owner, due, done, key, line: i });
  });
  return out;
}

/* ---------- 資料服務 ---------- */
const PJ = {
  projects: [], todos: [], meetings: [],
  async load() {
    const [ps, ts, ms] = await DB.tx(['projects', 'todos', 'meetings'], 'readonly', s => Promise.all([req(s.projects.getAll()), req(s.todos.getAll()), req(s.meetings.getAll())]));
    this.projects = ps; this.todos = ts; this.meetings = ms;
    return ps;
  },
  get(id) { return this.projects.find(p => p.id === id); },
  meetingsOf(pid) { return this.meetings.filter(m => m.projectId === pid).sort((a, b) => (b.datetime || '').localeCompare(a.datetime || '')); },
  todosOf(pid) { return this.todos.filter(t => t.projectId === pid); },
  blank() {
    return { id: '', customerId: '', name: '', status: 'idea', contactId: '', contactName: '', pm: '', sales: '', contractType: '', signStatus: '未簽約',
      announced: false, announceDate: '', announceNo: '', amount: '', startDate: '', endDate: '', nextFollowUpDate: '', acceptanceDate: '', acceptanceTerms: '',
      contractEndDate: '', important: '', costs: [], payments: [], statusHistory: [], createdAt: '', updatedAt: '' };
  },
  async save(data) {
    const now = nowISO();
    const p = Object.assign(this.blank(), data);
    p.name = String(p.name || '').trim();
    if (!p.name) throw new Error('請輸入專案名稱');
    if (!p.customerId) throw new Error('請選擇客戶');
    if (p.amount !== '' && isNaN(parseMoney(p.amount))) throw new Error('合約總金額請輸入數字');
    p.amount = p.amount === '' ? '' : parseMoney(p.amount);
    if (p.startDate && p.endDate && p.endDate < p.startDate) throw new Error('預計結束日不可早於開始日');
    await DB.tx(['projects', 'customers', 'contacts'], 'readwrite', async s => {
      const cust = await req(s.customers.get(p.customerId));
      if (!cust) throw new Error('所選客戶不存在');
      if (p.contactId) {
        const ct = await req(s.contacts.get(p.contactId));
        if (!ct || ct.customerId !== p.customerId) { p.contactId = ''; }
        else p.contactName = ct.name;
      }
      if (data.id) {
        const old = await req(s.projects.get(data.id));
        if (!old) throw new Error('找不到此專案，可能已被刪除');
        p.createdAt = old.createdAt; p.costs = data.costs || old.costs || []; p.payments = data.payments || old.payments || [];
        p.statusHistory = old.statusHistory || [];
        if (old.status !== p.status) p.statusHistory.push({ from: old.status, to: p.status, at: now });
      } else {
        p.id = uid(); p.createdAt = now; p.statusHistory = [{ from: '', to: p.status, at: now }];
      }
      p.updatedAt = now;
      await req(s.projects.put(p));
    });
    await this.load();
    return p;
  },
  async patch(id, fn) {
    let out;
    await DB.tx('projects', 'readwrite', async s => {
      const p = await req(s.projects.get(id));
      if (!p) throw new Error('找不到此專案');
      out = fn(p) || p;
      p.updatedAt = nowISO();
      await req(s.projects.put(p));
    });
    await this.load();
    return out;
  },
  setStatus(id, status) {
    return this.patch(id, p => { if (p.status !== status) { (p.statusHistory = p.statusHistory || []).push({ from: p.status, to: status, at: nowISO() }); p.status = status; } });
  },
  async remove(id) {
    const r = await DB.tx(['projects', 'meetings', 'todos'], 'readwrite', async s => {
      const p = await req(s.projects.get(id)); if (!p) throw new Error('找不到此專案');
      const ms = await req(s.meetings.index('projectId').getAllKeys(id));
      const ts = await req(s.todos.index('projectId').getAllKeys(id));
      ms.forEach(k => s.meetings.delete(k)); ts.forEach(k => s.todos.delete(k)); s.projects.delete(id);
      return { meetings: ms.length, todos: ts.length };
    });
    await this.load();
    return r;
  },
  /** 儲存會議，並（選擇性）在同一交易中同步待辦事項 */
  async saveMeeting(data, sync = true) {
    const now = nowISO();
    const m = { id: data.id || uid(), projectId: data.projectId, datetime: data.datetime, title: String(data.title || '').trim(), location: String(data.location || '').trim(),
      attendees: String(data.attendees || '').trim(), notes: String(data.notes || '') };
    if (!m.projectId) throw new Error('缺少所屬專案');
    if (!parseDateTime(m.datetime)) throw new Error('請輸入正確的會議時間');
    const res = { added: 0, updated: 0 };
    await DB.tx(['projects', 'meetings', 'todos'], 'readwrite', async s => {
      if (!await req(s.projects.get(m.projectId))) throw new Error('所屬專案不存在');
      if (data.id) {
        const old = await req(s.meetings.get(data.id));
        if (!old || old.projectId !== m.projectId) throw new Error('找不到此會議紀錄');
        m.createdAt = old.createdAt;
      } else m.createdAt = now;
      m.updatedAt = now;
      await req(s.meetings.put(m));
      if (sync) {
        const items = parseTodos(m.notes, m.datetime.slice(0, 10));
        const existing = (await req(s.todos.index('projectId').getAll(m.projectId))).filter(t => t.meetingId === m.id);
        for (const it of items) {
          const ex = existing.find(t => t.key === it.key);
          if (ex) {
            let ch = false;
            if (it.owner && ex.owner !== it.owner) { ex.owner = it.owner; ch = true; }
            if (it.due && ex.dueDate !== it.due) { ex.dueDate = it.due; ch = true; }
            if (it.done && !ex.done) { ex.done = true; ex.doneAt = now; ch = true; }
            if (ch) { ex.updatedAt = now; s.todos.put(ex); res.updated++; }
          } else {
            s.todos.put({ id: uid(), projectId: m.projectId, meetingId: m.id, key: it.key, text: it.text, owner: it.owner, dueDate: it.due, done: it.done, doneAt: it.done ? now : '', createdAt: now, updatedAt: now });
            res.added++;
          }
        }
      }
    });
    await this.load();
    return Object.assign(m, res);
  },
  async removeMeeting(id, keepTodos = true) {
    await DB.tx(['meetings', 'todos'], 'readwrite', async s => {
      const m = await req(s.meetings.get(id)); if (!m) throw new Error('找不到此會議紀錄');
      const ts = (await req(s.todos.index('projectId').getAll(m.projectId))).filter(t => t.meetingId === id);
      for (const t of ts) { if (keepTodos) { t.meetingId = ''; t.updatedAt = nowISO(); s.todos.put(t); } else s.todos.delete(t.id); }
      s.meetings.delete(id);
    });
    await this.load();
  },
  async saveTodo(data) {
    const now = nowISO();
    const t = { id: data.id || uid(), projectId: data.projectId, meetingId: data.meetingId || '', text: String(data.text || '').trim(), owner: String(data.owner || '').trim(),
      dueDate: data.dueDate || '', done: !!data.done };
    if (!t.text) throw new Error('請輸入待辦內容');
    await DB.tx(['projects', 'todos'], 'readwrite', async s => {
      if (!await req(s.projects.get(t.projectId))) throw new Error('所屬專案不存在');
      if (data.id) {
        const old = await req(s.todos.get(data.id)); if (!old) throw new Error('找不到此待辦事項');
        t.createdAt = old.createdAt; t.key = old.key || normKey(t.text); t.meetingId = old.meetingId; t.doneAt = t.done ? (old.doneAt || now) : '';
      } else { t.createdAt = now; t.key = normKey(t.text); t.doneAt = t.done ? now : ''; }
      t.updatedAt = now;
      await req(s.todos.put(t));
    });
    await this.load();
    return t;
  },
  async toggleTodo(id, done) {
    await DB.tx('todos', 'readwrite', async s => {
      const t = await req(s.todos.get(id)); if (!t) throw new Error('找不到此待辦事項');
      t.done = done; t.doneAt = done ? nowISO() : ''; t.updatedAt = nowISO();
      await req(s.todos.put(t));

    await this.load();
  },
  async removeTodo(id) { await DB.tx('todos', 'readwrite', s => req(s.todos.delete(id))); await this.load(); },
  async setStaff(list) { await DB.setMeta('staff', list); staffList = list; }
};

    list.sort((a, b) => { const x = val(a), y = val(b); if (typeof x === 'number') return (x - y) * dir; if (!x && y) return 1; if (x && !y) return -1; return String(x).localeCompare(String(y), 'zh-Hant') * dir; });
    const sumAmt = list.reduce((s, p) => s + (Number(p.amount) || 0), 0), sumGP = list.reduce((s, p) => s + pjGP(p).gp, 0);
    const th = (key, label) => `<th class="sortable" data-sort="${key}">${label}${f.sort === key ? ` <span class="sort-ind">${f.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;
    const box = $('#plist', body);
    if (!list.length) { box.innerHTML = `<div class="card empty">${PJ.projects.length ? '沒有符合條件的專案。' : '尚無專案，請按「＋ 新增專案」開始建立。'}</div>`; return; }
    box.innerHTML = `<div class="stat-row"><div class="stat"><b>${list.length}</b>專案數</div><div class="stat"><b>${nt(sumAmt)}</b>合約總金額</div><div class="stat ok"><b>${nt(sumGP)}</b>GP 合計${sumAmt ? `（${(sumGP / sumAmt * 100).toFixed(1)}%）` : ''}</div></div>

      <td class="name" data-label="專案名稱">${esc(p.name)}${open ? ` <span class="badge type" title="未完成待辦">待辦 ${open}</span>` : ''}</td>

      <td data-label="合約金額" class="${p.amount !== '' ? '' : 'empty-cell'}">${nt(p.amount)}</td>
      <td data-label="GP%" class="${g.pct == null ? 'empty-cell' : ''}">${g.pct == null ? '' : `<span style="color:${g.gp < 0 ? 'var(--danger)' : 'inherit'}">${g.pct.toFixed(1)}%</span>`}</td>
      <td data-label="PM／業務" class="${p.pm || p.sales ? '' : 'empty-cell'}">${esc([p.pm, p.sales].filter(Boolean).join('／'))}</td>
      <td data-label="下次跟進">${followBadge(p.nextFollowUpDate)}</td>
      <td data-label="合約到期">${expiryBadge(p.contractEndDate)}</td></tr>`; }).join('')}</tbody></table></div>`;
    $$('tr.clickable', box).forEach(tr => tr.addEventListener('click', () => openProject(tr.dataset.id)));

  };
  $$('[data-st]', body).forEach(b => b.addEventListener('click', () => { f.status = f.status === b.dataset.st ? '' : b.dataset.st; renderProjectList(body); }));
  $('#pq', body).addEventListener('input', e => { f.q = e.target.value; draw(); });

  $('#pclosed', body).addEventListener('change', e => { f.showClosed = e.target.checked; draw(); });
  $('#preset', body).addEventListener('click', () => { Object.assign(f, { q: '', status: '', pm: '', sales: '', ctype: '', ctag: '', showClosed: false }); renderProjectList(body); });
  draw();
}

/* ---------- 人員下拉（可直接新增） ---------- */
function staffSelectHtml(id, value) {
  const list = staffList.slice(); if (value && !list.includes(value)) list.push(value);
  return `<select class="input" id="${id}" data-staff>${optionList(list, value, '（未指定）')}<option value="__add">＋ 新增人員…</option></select>`;
}
function bindStaffSelects(root) {
  $$('select[data-staff]', root).forEach(sel => {
    let prev = sel.value;
    sel.addEventListener('focus', () => { prev = sel.value; });
    sel.addEventListener('change', () => {
      if (sel.value !== '__add') { prev = sel.value; return; }
      sel.value = prev;
      const m = openModal({ title: '新增人員', size: 'narrow', body: `<div class="field"><label>姓名</label><input class="input" id="newStaff" autofocus></div><p class="small muted">新增後會加入人員清單，可在「系統設定」管理。</p>`,
        footer: `<button class="btn" data-close>取消</button><button class="btn primary" data-ok>新增</button>` });
      const ok = async () => {
        const v = $('#newStaff', m.el).value.trim();
        const r = await guard(() => addStaff(v)); if (r === undefined) return;
        $$('select[data-staff]', root).forEach(s2 => { const cur = s2 === sel ? v : s2.value; const list = staffList.slice(); if (cur && !list.includes(cur)) list.push(cur);
          s2.innerHTML = optionList(list, cur, '（未指定）') + '<option value="__add">＋ 新增人員…</option>'; });
        m.close(); toast(r ? `已新增人員「${v}」` : `「${v}」已在人員清單中`);
      };
      $('[data-ok]', m.el).addEventListener('click', ok);
      $('#newStaff', m.el).addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    });
  });
}
function contractTypeOptions(value, gov) {
  const groups = gov ? CONTRACT_TYPES : [CONTRACT_TYPES[1], CONTRACT_TYPES[0], CONTRACT_TYPES[2]];
  const all = CONTRACT_TYPES.flatMap(g => g[1]);
  return `<option value="">請選擇</option>${groups.map(([g, list]) => `<optgroup label="${g}">${list.map(v => `<option${v === value ? ' selected' : ''}>${esc(v)}</option>`).join('')}</optgroup>`).join('')}${value && !all.includes(value) ? `<option selected>${esc(value)}</option>` : ''}`;
}

    <div class="field"><label>預計收款日</label><input type="date" class="input" id="y_due" value="${esc(x.dueDate)}"></div>
    <div class="field"><label>實收日（已收款才填）</label><input type="date" class="input" id="y_paid" value="${esc(x.paidDate)}"></div>
    <div class="field"><label>發票號碼</label><input class="input" id="y_inv" value="${esc(x.invoiceNo)}" placeholder="例如 AB12345678"></div>
    <div class="field"><label>備註</label><input class="input" id="y_note" value="${esc(x.note)}"></div></div>`,
    footer: `<button class="btn" data-close>取消</button><button class="btn primary" data-save>儲存</button>` });
  $$('[data-pct]', m.el).forEach(b => b.addEventListener('click', () => { if (p.amount === '') return toast('請先填寫合約總金額', 'warn'); $('#y_amt', m.el).value = Math.round(Number(p.amount) * Number(b.dataset.pct) / 100).toLocaleString('zh-TW'); }));
  $('[data-save]', m.el).addEventListener('click', async () => {
    const d = { id: x.id || uid(), term: $('#y_term', m.el).value.trim(), amount: parseMoney($('#y_amt', m.el).value), dueDate: $('#y_due', m.el).value, paidDate: $('#y_paid', m.el).value, invoiceNo: $('#y_inv', m.el).value.trim(), note: $('#y_note', m.el).value.trim() };
    if (!d.term) return toast('請輸入期別', 'warn');
    if ($('#y_amt', m.el).value.trim() === '' || isNaN(d.amount)) return toast('請輸入收款金額', 'warn');
    const ok = await guard(() => PJ.patch(p.id, q => { q.payments = q.payments || []; const i = q.payments.findIndex(z => z.id === d.id); if (i >= 0) q.payments[i] = d; else q.payments.push(d); }).then(() => true), x.id ? '收款期別已更新' : '收款期別已新增');
    if (ok) { m.close(); render(); }
  });
}

/* ============================================================
 * F. SI 專案管理 — 甘特圖、待辦總覽、合約到期、儀表板、週報
 * ============================================================ */
function dayNum(d) { const [y, m, dd] = d.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, dd) / 86400000); }
function numDay(n) { const d = new Date(n * 86400000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
function pjRange(p) {
  const s = p.startDate || (p.createdAt ? todayStr(new Date(p.createdAt)) : '');
  const e = p.endDate || p.acceptanceDate || p.contractEndDate || '';
  return s && e && e >= s ? [s, e] : null;
}

/* ---------- 甘特圖 ---------- */
function renderGantt(body) {
  const f = state.si;
  const list = PJ.projects.filter(p => f.ganttClosed || p.status !== 'closed')
    .sort((a, b) => ((pjRange(a) || ['9999'])[0]).localeCompare((pjRange(b) || ['9999'])[0]) || a.name.localeCompare(b.name, 'zh-Hant'));
  const px = { month: 6, quarter: 2.2, year: 0.75 }[f.ganttScale] || 6;
  const t = todayStr();
  const marks = p => {
    const out = [];
    PJ.meetingsOf(p.id).forEach(m => out.push({ d: m.datetime.slice(0, 10), cls: 'mk-meet', sym: '◆', tip: `會議 ${fmtActDT(m.datetime)} ${m.title || ''}` }));
    if (p.acceptanceDate) out.push({ d: p.acceptanceDate, cls: 'mk-acc', sym: '▲', tip: `驗收 ${p.acceptanceDate}` });
    (p.payments || []).forEach(x => { const d = x.paidDate || x.dueDate; if (d) out.push({ d, cls: x.paidDate ? 'mk-paid' : 'mk-pay', sym: '●', tip: `${x.term} ${nt(x.amount)} ${x.paidDate ? '已收 ' + x.paidDate : '預計 ' + x.dueDate}` }); });
    if (p.contractEndDate) out.push({ d: p.contractEndDate, cls: 'mk-end', sym: '⚑', tip: `合約到期 ${p.contractEndDate}` });
    return out;
  };
  let min = dayNum(t) - 14, max = dayNum(t) + 60;
  list.forEach(p => { const r = pjRange(p); if (r) { min = Math.min(min, dayNum(r[0])); max = Math.max(max, dayNum(r[1])); } marks(p).forEach(k => { min = Math.min(min, dayNum(k.d)); max = Math.max(max, dayNum(k.d)); }); });
  // 對齊到月初／月底
  const sd = numDay(min - 3).slice(0, 8) + '01'; min = dayNum(sd);
  const ed = addMonths(numDay(max).slice(0, 8) + '01', 1); max = dayNum(ed) - 1;
  const W = (max - min + 1) * px;
  const months = []; for (let d = sd; dayNum(d) <= max; d = addMonths(d, 1)) months.push(d);
  const x = d => (dayNum(d) - min) * px;
  body.innerHTML = `<div class="toolbar">
      <div class="seg">${[['month', '月'], ['quarter', '季'], ['year', '年']].map(([k, l]) => `<label><input type="radio" name="gscale" value="${k}"${f.ganttScale === k ? ' checked' : ''}><span>${l}檢視</span></label>`).join('')}</div>
      <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="gclosed"${f.ganttClosed ? ' checked' : ''} style="width:18px;height:18px">顯示已結案</label>
      <button class="btn sm" id="gtoday">回到今天</button></div>
    <div class="gantt-legend small">${PJ_STATUS.map(s => `<span><i style="background:${s.c}"></i>${s.t}</span>`).join('')}<span><b class="mk-meet">◆</b>會議</span><span><b class="mk-acc">▲</b>驗收</span><span><b class="mk-pay">●</b>預計收款</span><span><b class="mk-paid">●</b>已收款</span><span><b class="mk-end">⚑</b>合約到期</span></div>
    ${list.length ? `<div class="gantt" id="gantt"><div class="g-names"><div class="g-head">專案</div>${list.map(p => `<div class="g-name" data-open-pj="${esc(p.id)}" title="${esc(p.name)}"><b>${esc(p.name)}</b><span>${esc(customerName(p.customerId))}</span></div>`).join('')}</div>
      <div class="g-scroll" id="gscroll"><div class="g-canvas" style="width:${W}px">
        <div class="g-head">${months.map(d => `<div class="g-month" style="left:${x(d)}px;width:${(dayNum(addMonths(d, 1)) - dayNum(d)) * px}px">${px >= 2 ? `${Number(d.slice(5, 7))}月${d.slice(5, 7) === '01' || d === sd ? ` ${d.slice(0, 4)}` : ''}` : (d.slice(5, 7) === '01' || d === sd ? d.slice(0, 4) : '')}</div>`).join('')}</div>
        <div class="g-today" style="left:${x(t)}px" title="今天 ${t}"></div>
        ${list.map(p => { const r = pjRange(p), s = pjStatus(p.status); return `<div class="g-row">${r ? `<div class="g-bar" data-open-pj="${esc(p.id)}" style="left:${x(r[0])}px;width:${Math.max(px, (dayNum(r[1]) - dayNum(r[0]) + 1) * px)}px;background:${s.c}" title="${esc(p.name)}｜${s.t}｜${r[0]} ～ ${r[1]}"><span>${esc(s.t)}</span></div>` : `<div class="g-none">未設定期間（請編輯專案填寫預計開始／結束日）</div>`}
          ${marks(p).map(k => `<b class="g-mk ${k.cls}" style="left:${x(k.d)}px" title="${esc(k.tip)}">${k.sym}</b>`).join('')}</div>`; }).join('')}
      </div></div></div>` : '<div class="card empty">尚無專案</div>'}
    <p class="small muted">橫條為預計期間（未填結束日時，依驗收日或合約到期日顯示）。點選專案名稱或橫條可開啟專案。</p>`;
  $$('input[name=gscale]', body).forEach(r => r.addEventListener('change', () => { f.ganttScale = r.value; renderGantt(body); }));
  $('#gclosed', body).addEventListener('change', e => { f.ganttClosed = e.target.checked; renderGantt(body); });
  $$('[data-open-pj]', body).forEach(b => b.addEventListener('click', () => openProject(b.dataset.openPj)));
  const sc = $('#gscroll', body);
  const toToday = () => { if (sc) sc.scrollLeft = Math.max(0, x(t) - sc.clientWidth / 3); };
  $('#gtoday', body).addEventListener('click', toToday);
  requestAnimationFrame(toToday);
}

/* ---------- 待辦總覽 ---------- */
function renderTodoBoard(body) {
  const f = state.si, t = todayStr(), wk = addDays(t, 7);
  const owners = [...new Set(staffList.concat(PJ.todos.map(x => x.owner)).filter(Boolean))];
  const pjs = PJ.projects.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  const all = PJ.todos.filter(x => (!f.todoOwner || x.owner === f.todoOwner) && (!f.todoProject || x.projectId === f.todoProject) && PJ.get(x.projectId));
  const open = all.filter(x => !x.done);
  const groups = [['已逾期', open.filter(x => x.dueDate && x.dueDate < t)], ['今天到期', open.filter(x => x.dueDate === t)], ['7 天內到期', open.filter(x => x.dueDate > t && x.dueDate <= wk)],
    ['之後', open.filter(x => x.dueDate > wk)], ['未設定到期日', open.filter(x => !x.dueDate)]];
  const done = all.filter(x => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  body.innerHTML = `<div class="toolbar"><select class="input" id="tdOwner">${optionList(owners, f.todoOwner, '全部負責人')}</select>
    <select class="input" id="tdPj"><option value="">全部專案</option>${pjs.map(p => `<option value="${esc(p.id)}"${p.id === f.todoProject ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="tdDone"${f.todoShowDone ? ' checked' : ''} style="width:18px;height:18px">顯示已完成</label>
    <button class="btn primary" id="tdNew">＋ 新增待辦</button></div>
    ${groups.map(([title, list]) => list.length ? `<div class="card"><h2>${title} <span class="count">${list.length}</span></h2>${todoListHtml(sortTodos(list), true)}</div>` : '').join('') || '<div class="card empty">沒有未完成的待辦事項 👍</div>'}
    ${f.todoShowDone && done.length ? `<div class="card"><h2>已完成 <span class="count">${done.length}</span></h2>${todoListHtml(done.slice(0, 100), true)}</div>` : ''}`;
  $('#tdOwner', body).addEventListener('change', e => { f.todoOwner = e.target.value; renderTodoBoard(body); });
  $('#tdPj', body).addEventListener('change', e => { f.todoProject = e.target.value; renderTodoBoard(body); });
  $('#tdDone', body).addEventListener('change', e => { f.todoShowDone = e.target.checked; renderTodoBoard(body); });
  $('#tdNew', body).addEventListener('click', () => {
    const pid = f.todoProject || '';
    if (!PJ.projects.length) return toast('請先新增專案', 'warn');
    if (pid) return todoForm(pid, null, () => render());
    const m = openModal({ title: '選擇專案', size: 'narrow', body: `<select class="input" id="tdPick">${pjs.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>`, footer: `<button class="btn" data-close>取消</button><button class="btn primary" data-ok>下一步</button>` });
    $('[data-ok]', m.el).addEventListener('click', () => { const v = $('#tdPick', m.el).value; m.close(); todoForm(v, null, () => render()); });
  });
  bindTodoList(body, () => render());
}

/* ---------- 合約到期 ---------- */
function renderExpiry(body) {
  const f = state.si, t = todayStr();
  const opts = [['month', '本月到期'], ['m3', '3 個月內到期'], ['m6', '6 個月內到期'], ['expired', '已到期'], ['all', '全部（有到期日）']];
  const inRange = p => {
    const e = p.contractEndDate; if (!e) return false;
    if (f.expiry === 'month') return e.slice(0, 7) === t.slice(0, 7);
    if (f.expiry === 'm3') return e >= t && e <= addMonths(t, 3);
    if (f.expiry === 'm6') return e >= t && e <= addMonths(t, 6);
    if (f.expiry === 'expired') return e < t;
    return true;
  };
  const cnt = k => PJ.projects.filter(p => { const o = f.expiry; f.expiry = k; const r = inRange(p); f.expiry = o; return r; }).length;
  const list = PJ.projects.filter(inRange).sort((a, b) => a.contractEndDate.localeCompare(b.contractEndDate) * (f.expiry === 'expired' ? -1 : 1));
  body.innerHTML = `<div class="status-chips">${opts.map(([k, l]) => `<button class="chip${f.expiry === k ? ' on' : ''}" data-exp="${k}" style="--c:${k === 'expired' ? '#5a6476' : k === 'm6' ? '#cf6f0f' : '#cf3e3e'}"><b>${cnt(k)}</b>${l}</button>`).join('')}</div>
    <p class="small muted">合約即將到期的專案，是洽談續約或新商機的好時機。可設定「下次跟進日期」提醒自己聯繫客戶。</p>
    ${list.length ? `<div class="tablewrap cards"><table class="list"><thead><tr><th>專案</th><th>客戶</th><th>合約到期</th><th>合約金額</th><th>簽約形式</th><th>業務</th><th>下次跟進</th><th></th></tr></thead><tbody>
    ${list.map(p => `<tr data-id="${esc(p.id)}"><td class="name" data-label="專案"><a href="#" data-open>${esc(p.name)}</a></td><td data-label="客戶">${esc(customerName(p.customerId))}</td><td data-label="合約到期">${expiryBadge(p.contractEndDate)}</td>
      <td data-label="合約金額">${nt(p.amount) || '—'}</td><td data-label="簽約形式">${esc(p.contractType) || '—'}</td><td data-label="業務">${esc(p.sales) || '—'}</td><td data-label="下次跟進">${followBadge(p.nextFollowUpDate)}</td>
      <td data-label="操作"><button class="btn sm" data-fu>設定跟進</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">此區間沒有到期的合約</div>'}`;
  $$('[data-exp]', body).forEach(b => b.addEventListener('click', () => { f.expiry = b.dataset.exp; renderExpiry(body); }));
  $$('tr[data-id]', body).forEach(tr => {
    const p = PJ.get(tr.dataset.id);
    $('[data-open]', tr).addEventListener('click', e => { e.preventDefault(); openProject(p.id); });
    $('[data-fu]', tr).addEventListener('click', () => {
      const m = openModal({ title: '設定續約跟進日期', size: 'narrow', body: `<p style="margin-top:0"><b>${esc(p.name)}</b><br><span class="small muted">合約到期：${esc(p.contractEndDate)}</span></p>
        <div class="field"><label>下次跟進日期</label><input type="date" class="input" id="xfu" value="${esc(p.nextFollowUpDate || addDays(t, 7))}"></div>
        <div class="row" style="margin-top:8px">${[[90, '到期前 3 個月'], [60, '到期前 2 個月'], [30, '到期前 1 個月']].map(([n, l]) => `<button class="btn sm" data-before="${n}">${l}</button>`).join('')}</div>`,
        footer: `<button class="btn" data-close>取消</button><button class="btn primary" data-save>儲存</button>` });
      $$('[data-before]', m.el).forEach(b => b.addEventListener('click', () => { let d = addDays(p.contractEndDate, -Number(b.dataset.before)); if (d < t) d = t; $('#xfu', m.el).value = d; }));
      $('[data-save]', m.el).addEventListener('click', async () => { const v = $('#xfu', m.el).value; if (!v) return; const ok = await guard(() => PJ.patch(p.id, x => { x.nextFollowUpDate = v; }).then(() => true), '跟進日期已設定'); if (ok) { m.close(); render(); } });
    });
  });
}

/* ---------- 首頁儀表板：SI 專案概況 ---------- */
async function siDashboardHtml() {

/* ============================================================
 * 週報
 * ============================================================ */
function mondayOf(d) { const n = dayNum(d); const wd = (new Date(n * 86400000).getUTCDay() + 6) % 7; return numDay(n - wd); }
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function mdw(d) { const dt = new Date(dayNum(d) * 86400000); return `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}（${WD[dt.getUTCDay()]}）`; }
function buildWeekly(weekStart) {
  const ws = weekStart, we = addDays(ws, 6), ns = addDays(ws, 7), ne = addDays(ws, 13), t = todayStr();
  const inWeek = d => d && d >= ws && d <= we;
  const projects = PJ.projects.map(p => {
    const ms = PJ.meetingsOf(p.id), ts = PJ.todosOf(p.id);
    const progress = [];
    (p.statusHistory || []).filter(h => h.from && inWeek(todayStr(new Date(h.at)))).forEach(h => progress.push(`狀態：${pjStatus(h.from).t} → ${pjStatus(h.to).t}`));
    ms.filter(m => inWeek(m.datetime.slice(0, 10))).reverse().forEach(m => {
      const lines = String(m.notes || '').split(/\r?\n/).map(l => l.trim()).filter(l => l && !TODO_LINE_RE.test(l)).map(l => l.replace(/^[-*•・]\s*/, ''));
      progress.push(`${mdw(m.datetime.slice(0, 10))} ${m.title || '會議'}${lines.length ? '：' + lines.slice(0, 2).join('；') : ''}`);
    });
    ts.filter(x => x.done && inWeek(x.doneAt ? todayStr(new Date(x.doneAt)) : '')).forEach(x => progress.push(`✓ 完成：${x.text}`));
    (p.payments || []).filter(x => inWeek(x.paidDate)).forEach(x => progress.push(`收款：${x.term} ${nt(x.amount)}`));
    const discuss = [];
    String(p.important || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => discuss.push(l.replace(/^[-*•・]\s*/, '')));
    ts.filter(x => !x.done && x.dueDate && x.dueDate < t).forEach(x => discuss.push(`逾期待辦：${x.text}${x.owner ? `（${x.owner}）` : ''}，原訂 ${x.dueDate}`));
    (p.costs || []).filter(c => !c.quoted).forEach(c => discuss.push(`待廠商提供成本：${[c.vendor, c.item].filter(Boolean).join(' ')}`));
    (p.payments || []).filter(x => !x.paidDate && x.dueDate && x.dueDate < t).forEach(x => discuss.push(`逾期未收款：${x.term} ${nt(x.amount)}（預計 ${x.dueDate}）`));
    const follow = [];
    ts.filter(x => !x.done && x.dueDate && x.dueDate >= t && x.dueDate <= ne).sort((a, b) => a.dueDate.localeCompare(b.dueDate))
      .forEach(x => follow.push(`${x.text}${x.owner ? `（${x.owner}）` : ''}　${mdw(x.dueDate)}`));
    ts.filter(x => !x.done && !x.dueDate).forEach(x => follow.push(`${x.text}${x.owner ? `（${x.owner}）` : ''}　未定期限`));
    if (p.nextFollowUpDate && p.nextFollowUpDate <= ne) follow.push(`專案跟進：${mdw(p.nextFollowUpDate)}${p.nextFollowUpDate < t ? '（已逾期）' : ''}`);
    if (p.acceptanceDate && p.acceptanceDate >= t && p.acceptanceDate <= addDays(ne, 7)) follow.push(`驗收：${mdw(p.acceptanceDate)}`);
    (p.payments || []).filter(x => !x.paidDate && x.dueDate && x.dueDate >= t && x.dueDate <= ne).forEach(x => follow.push(`預計收款：${x.term} ${nt(x.amount)}　${mdw(x.dueDate)}`));
    if (p.contractEndDate && p.contractEndDate >= t && p.contractEndDate <= addMonths(t, 3)) follow.push(`合約將於 ${p.contractEndDate} 到期，評估續約`);
    const nextMeet = ms.filter(m => { const d = m.datetime.slice(0, 10); return d >= ns && d <= ne; }).reverse()
      .map(m => `${mdw(m.datetime.slice(0, 10))} ${m.datetime.slice(11, 16)} ${m.title || '會議'}${m.location ? `（${m.location}）` : ''}`);
    const active = progress.length || nextMeet.length;
    const include = p.status !== 'closed' && p.status !== 'idea' || !!active;
    return { p, include, progress, discuss, follow, nextMeet };
  }).sort((a, b) => PJ_STATUS.findIndex(s => s.k === a.p.status) - PJ_STATUS.findIndex(s => s.k === b.p.status) || a.p.name.localeCompare(b.p.name, 'zh-Hant'));
  return { ws, we, ns, ne, projects };
}

function weeklyText(data, rows) {

/* ---------- PPTX 產生（自行組裝 OOXML，不使用外部套件） ---------- */
const PX = { W: 12192000, H: 6858000, FONT: 'Microsoft JhengHei' };

    <a:tcPr marL="${EMU(0.06)}" marR="${EMU(0.06)}" marT="${EMU(0.04)}" marB="${EMU(0.04)}" anchor="ctr"><a:lnL w="6350"><a:solidFill><a:srgbClr val="DDE3EC"/></a:solidFill></a:lnL><a:lnR w="6350"><a:solidFill><a:srgbClr val="DDE3EC"/></a:solidFill></a:lnR><a:lnT w="6350"><a:solidFill><a:srgbClr val="DDE3EC"/></a:solidFill></a:lnT><a:lnB w="6350"><a:solidFill><a:srgbClr val="DDE3EC"/></a:solidFill></a:lnB><a:solidFill><a:srgbClr val="${head ? '1D4F9C' : ri % 2 ? 'F5F7FB' : 'FFFFFF'}"/></a:solidFill></a:tcPr></a:tc>`;

    const body = part.map(r => { const g = pjGP(r.p); return [clip(r.p.name, 22), clip(customerName(r.p.customerId), 14), pjStatus(r.p.status).t, nt(r.p.amount) || '—', g.pct == null ? '—' : g.pct.toFixed(1) + '%', r.p.pm || '—', r.p.nextFollowUpDate || '—', clip(r.progress[0] || '—', 30)]; });

  $$('[data-rm-staff]', el).forEach(b => b.addEventListener('click', async () => {
    const name = b.dataset.rmStaff;
    if (!await confirmDialog(`確定從人員清單移除「${esc(name)}」？\n已指派給此人員的專案不會變更。`, { okText: '移除' })) return;
    const ok = await guard(() => PJ.setStaff(staffList.filter(x => x !== name)).then(() => true), '已移除人員'); if (ok) render();
  }));
  $('#addInd', el).addEventListener('click', async () => {
    const r = await guard(() => addIndustry($('#newInd', el).value));
    if (r === true) { toast('已新增產業'); render(); } else if (r === false) toast('此產業已在清單中', 'warn');
  });
  $$('[data-rm-ind]', el).forEach(b => b.addEventListener('click', async () => {
    const name = b.dataset.rmInd;
    if (!await confirmDialog(`確定要從產業清單移除「${esc(name)}」嗎？\n已使用此產業的客戶資料不會變更。`, { okText: '移除' })) return;
    const ok = await guard(() => removeIndustry(name).then(() => true), '已移除產業選項'); if (ok) render();
  }));
  $('#askPersist', el).addEventListener('click', async () => {
    if (!navigator.storage || !navigator.storage.persist) return toast('此瀏覽器不支援持久保存設定', 'warn');
    try { const ok = await navigator.storage.persist(); toast(ok ? '已啟用持久保存' : '瀏覽器未同意持久保存（常用的網站通常會自動核准）', ok ? 'ok' : 'warn'); } catch (e) { toast('申請失敗：' + errMsg(e), 'err'); }
    render();
  });
  $('#bkFirst', el).addEventListener('click', async () => { const r = await guard(() => exportBackup()); if (r) { toast('備份已匯出'); render(); } });
  $('#wipe', el).addEventListener('click', async () => {
    if (!await confirmDialog('確定要清除本機<b>全部</b>客戶、聯絡人與業務活動嗎？\n此動作無法復原。', { title: '清除全部資料', okText: '下一步', danger: true })) return;
    if (!await confirmDialog('再次確認：資料清除後無法救回。\n您是否已經匯出備份？', { title: '最後確認', okText: '確定清除全部資料', danger: true })) return;
    const ok = await guard(() => DB.tx(['customers', 'contacts', 'activities'], 'readwrite', s => Promise.all([req(s.customers.clear()), req(s.contacts.clear()), req(s.activities.clear())])).then(() => Store.loadCustomers()).then(() => true), '已清除全部資料');
    if (ok) render();
  });
}

async function init() {
  buildNav();
  try {
    await DB.open();
    state.lastBackupAt = (await DB.getMeta('lastBackupAt')) || null;
    customIndustries = (await DB.getMeta('customIndustries')) || [];
    staffList = (await DB.getMeta('staff')) || [];
    await Store.loadCustomers();
  } catch (e) {
    console.error(e);
    const env = envInfo();
    $('#content').innerHTML = `<div class="fatal"><div class="notice danger"><h2 style="font-size:18px;margin-bottom:8px">無法開啟本機資料庫</h2>
      <p>錯誤訊息：${esc(errMsg(e))}</p>
      <p>可能原因：</p><ul class="steps"><li>使用私密／無痕瀏覽模式，或瀏覽器設定封鎖了網站資料。</li>
      <li>${env.browser === 'Safari' && env.p === 'file:' ? '<b>Safari 以 file:// 開啟時可能無法使用 IndexedDB</b>，請改用 Chrome／Edge，或透過本機伺服器開啟。' : '瀏覽器版本過舊或不支援 IndexedDB。'}</li>
      <li>資料庫被其他分頁鎖定：請關閉其他 CRM 分頁。</li></ul>
      <p>為避免資料遺失，系統目前不會進行任何讀寫。</p>
      <button class="btn primary" id="retry">重新嘗試</button></div></div>`;
    $('#retry').addEventListener('click', () => location.reload());
    $('#pageTitle').textContent = '無法開啟資料庫';
    return;
  }
  window.addEventListener('hashchange', route);
  route();
}
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('發生未預期的錯誤：' + errMsg(e.reason), 'err'); });
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
