      <div id="ocrStatus" class="small muted"></div>
      <div class="notice info small" style="margin-top:8px">${hasTD ? '此瀏覽器支援內建文字辨識，拍照後會自動辨識並填入欄位。' : `本系統不連網、不上傳照片，文字辨識使用<b>手機內建的離線辨識功能</b>：
        <ul class="steps">${isAndroid ? '' : '<li><b>iPhone／iPad</b>：拍完後開啟照片，長按名片上的文字 →「全選」→「拷貝」；或在下方文字框點一下，選「掃描文字」直接對準名片。</li>'}
        ${isIOS ? '' : '<li><b>Android</b>：在相簿用「Google 智慧鏡頭」或「擷取文字」選取全部文字 → 複製；Gboard 鍵盤也可使用「掃描文字」。</li>'}
        <li>將文字貼到下方，系統會<b>自動拆解</b>成公司、姓名、職稱、電話、Email 等欄位。</li></ul>`}</div>
      <div class="field" style="margin-top:10px"><label for="cardText">名片文字</label>
        <textarea class="input" id="cardText" rows="6" placeholder="將名片上的全部文字貼在這裡（每行一項即可，順序不拘）"></textarea></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="cardParse">🔍 自動解析欄位</button><span class="small muted" id="parseMsg"></span></div>
      <div id="existBox" style="margin-top:12px"></div>
      <div class="section-t" style="margin-top:16px">步驟 2　確認客戶資料</div>
      <div class="form-grid" style="margin-top:10px" id="cardCust">${customerFields(blankCustomer(), 'k')}</div>
      <div class="section-t" style="margin-top:16px">步驟 3　確認聯絡人資料（姓名空白則不建立聯絡人）</div>
      <div class="form-grid" style="margin-top:10px">${contactFields({ name: '', department: '', title: '', phone: '', mobile: '', email: '', note: '' }, 'kc')}</div>`,
    footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="cardSave">儲存</button>`
  });
  bindCustomerFields(m.el, 'k', null);
  let target = 'new';
  const setVal = (id, v) => { const e = $('#' + id, m.el); if (e && v) { e.value = v; e.dispatchEvent(new Event('input')); } };
  const apply = () => {
    const txt = $('#cardText', m.el).value;
    if (!txt.trim()) return toast('請先貼上或辨識名片文字', 'warn');
    const r = parseCard(txt);
    setVal('k_name', r.company); setVal('k_taxId', r.taxId); setVal('k_contactAddress', r.address); setVal('k_phone', r.phone.replace(/\s*(#|ext\.?|分機|轉).*$/i, '')); setVal('k_fax', r.fax); setVal('k_website', r.website);
    if (r.region) $('#k_region', m.el).value = r.region;
    if (r.industry) { $('#k_industry', m.el).value = r.industry; $('#k_industryOther', m.el).classList.add('hidden'); }
    setVal('kc_name', r.name); setVal('kc_title', r.title); setVal('kc_department', r.department);
    setVal('kc_phone', r.phone); setVal('kc_mobile', r.mobile); setVal('kc_email', r.email);
    const extra = []; if (r.rest.length) extra.push(...r.rest);
    if (extra.length && !$('#kc_note', m.el).value) $('#kc_note', m.el).value = extra.join('\n');
    const filled = ['company', 'name', 'title', 'phone', 'mobile', 'email', 'address', 'website', 'taxId'].filter(k => r[k]).length;
    $('#parseMsg', m.el).textContent = `已自動填入 ${filled} 個欄位，請逐項確認後再儲存。`;
    // 既有客戶比對
    const d = r.company ? Store.findDuplicates({ name: r.company, taxId: r.taxId }) : [];
    const eb = $('#existBox', m.el);
    if (d.length) {
      eb.innerHTML = `<div class="notice warn">系統中已有相同公司：<b>${esc(d[0].name)}</b>${d[0].archived ? '（已封存）' : ''}。請選擇：
        <div class="seg" style="margin-top:8px;background:#fff"><label><input type="radio" name="cardTarget" value="${esc(d[0].id)}" checked><span>加入為既有客戶的聯絡人</span></label><label><input type="radio" name="cardTarget" value="new"><span>建立新客戶</span></label></div></div>`;
      target = d[0].id;
      $$('input[name=cardTarget]', eb).forEach(x => x.addEventListener('change', () => { target = x.value; $('#cardCust', m.el).style.opacity = target === 'new' ? '1' : '.45'; }));
      $('#cardCust', m.el).style.opacity = '.45';
    } else { eb.innerHTML = ''; target = 'new'; $('#cardCust', m.el).style.opacity = '1'; }
  };
  $('#cardParse', m.el).addEventListener('click', apply);
  $('#cardText', m.el).addEventListener('paste', () => setTimeout(apply, 50));
  const onImg = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    const img = $('#cardImg', m.el); img.src = objUrl; img.classList.remove('hidden');
    const st = $('#ocrStatus', m.el);
    if (!hasTD) { st.textContent = '照片僅供對照，不會儲存或上傳。請使用手機內建文字辨識取得文字後貼到下方。'; return; }
    st.textContent = '辨識中…';
    try {
      const t = await detectTextFromImage(f);
      if (t && t.trim()) { $('#cardText', m.el).value = t; st.textContent = '辨識完成，已自動解析。'; apply(); }
      else st.textContent = '未辨識到文字，請改用手動貼上。';
    } catch (err) { st.textContent = '此裝置無法執行內建辨識，請改用手機內建文字辨識後貼上。'; }
  };
  $('#cardCam', m.el).addEventListener('change', onImg);
  $('#cardPick', m.el).addEventListener('change', onImg);
  $('#cardSave', m.el).addEventListener('click', async () => {
    const ct = readContactFields(m.el, 'kc');
    if (!validateContact(m.el, ct, 'kc', false)) return;
    if (target !== 'new') {
      if (!ct.name.trim()) return toast('加入既有客戶時，請填寫聯絡人姓名', 'warn');
      const r = await guard(() => Store.saveContact(Object.assign(ct, { customerId: target })), '聯絡人已加入既有客戶');
      if (r) { m.close(); openCustomer(target, 'contacts'); }
      return;
    }
    const d = readCustomerFields(m.el, 'k');
    if (!validateCustomer(m.el, 'k', d)) return;
    const dups = Store.findDuplicates(d);
    if (dups.length && !await confirmDialog(`系統中已有相似的客戶「${esc(dups[0].name)}」，仍要建立新客戶嗎？`, { okText: '仍要建立' })) return;
    const r = await guard(() => Store.createWithContact(d, ct.name.trim() ? ct : null), ct.name.trim() ? '客戶與聯絡人已新增' : '客戶已新增');
    if (r) { m.close(); openCustomer(r.id); }
  });
}

/** 名片新增：客戶與聯絡人在同一交易中建立 */
Store.createWithContact = async function (custData, contactData) {
  const c = cleanCustomer(custData);
  if (!c.name) throw new Error('客戶名稱為必填');
  const now = nowISO(); c.id = uid(); c.createdAt = now; c.updatedAt = now;
  await DB.tx(['customers', 'contacts'], 'readwrite', async s => {
    await req(s.customers.put(c));
    if (contactData) {
      const o = { id: uid(), customerId: c.id, createdAt: now, updatedAt: now };
      for (const k of CONTACT_FIELDS) o[k] = String(contactData[k] || '').trim();
      await req(s.contacts.put(o));
    }
  });
  await this.loadCustomers();
  maybePersist();
  return c;
};

/* ============================================================
 * I. 系統設定 與 啟動
 * ============================================================ */
let persistAsked = false;
async function maybePersist() {
  if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
  persistAsked = true;
  try { if (!(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* 不支援時略過 */ }
}
function envInfo() {
  const p = location.protocol;
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? 'Microsoft Edge' : /Firefox\//.test(ua) ? 'Firefox' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '其他瀏覽器';
  return { p, browser, origin: p === 'file:' ? 'file://（本機檔案）' : location.origin };
}
async function renderSettings(el) {
  const env = envInfo();
  let persisted = '不支援查詢', usage = '無法取得';
  try { if (navigator.storage && navigator.storage.persisted) persisted = (await navigator.storage.persisted()) ? '已啟用（瀏覽器不會自動清除）' : '未啟用（空間不足時瀏覽器可能清除資料）'; } catch (e) { /* 略過 */ }
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); usage = `約 ${(e.usage / 1024 / 1024).toFixed(2)} MB（可用上限約 ${(e.quota / 1024 / 1024 / 1024).toFixed(1)} GB）`; } } catch (e) { /* 略過 */ }
  const s = Store.stats();
  el.innerHTML = `
    <div class="card"><h2>💾 資料儲存位置</h2>
      <dl class="info">
        <dt>儲存方式</dt><dd>瀏覽器 IndexedDB（資料庫名稱：${esc(APP.dbName)}）</dd>
        <dt>目前瀏覽器</dt><dd>${esc(env.browser)}</dd>
        <dt>網站來源</dt><dd>${esc(env.origin)}</dd>
        <dt>使用空間</dt><dd>${esc(usage)}</dd>
        <dt>持久保存</dt><dd>${esc(persisted)} <button class="btn sm" id="askPersist" style="margin-left:6px">申請持久保存</button></dd>
        <dt>目前資料</dt><dd>客戶 ${s.total + s.archived} 筆（含封存 ${s.archived} 筆）</dd>
        <dt>上次備份</dt><dd>${state.lastBackupAt ? esc(fmtDT(state.lastBackupAt)) : '尚未備份'}</dd>
      </dl>
      <div class="notice warn" style="margin-top:14px;margin-bottom:0"><b>重要提醒</b>
        <ul class="steps"><li>資料只存在「這台裝置 + 這個瀏覽器 + 這個網站來源」。換電腦、換手機、換瀏覽器（例如 Chrome 改 Edge），都看不到彼此的資料。</li>
        <li>清除瀏覽器的「Cookie 與網站資料」、使用私密／無痕視窗，都可能讓資料消失或無法保存。</li>
        <li>iPhone Safari 若連續 7 天未開啟此網頁，系統可能自動清除資料；建議「加入主畫面」後使用，並定期備份。</li>
        <li>要在不同裝置間移轉資料，請使用「匯出 Excel 備份 → 在另一台裝置匯入」。</li>
        <li>本系統未對資料另行加密，也未經資安稽核；能使用此裝置與瀏覽器帳號的人即可看到資料，請妥善保管裝置與備份檔。</li></ul></div></div>
    <div class="card"><h2>🧭 開啟方式與相容性</h2>
      <div class="tablewrap"><table class="list"><thead><tr><th>開啟方式</th><th>說明</th></tr></thead><tbody>
        <tr><td>Chrome／Edge 直接開啟 crm.html（file://）</td><td><b>建議</b>。可正常使用，匯出時會出現「另存新檔」視窗。請固定放在同一個資料夾，不要搬移或改名。</td></tr>
        <tr><td>Firefox 直接開啟（file://）</td><td>可使用，但搬移或重新命名 HTML 檔後會被視為不同來源，看起來像資料不見（資料仍在舊位置）。匯出改為下載方式。</td></tr>
        <tr><td>Safari（Mac）直接開啟</td><td>file:// 下的 IndexedDB 可能無法使用。建議改用 Chrome／Edge，或使用本機伺服器。</td></tr>
        <tr><td>手機</td><td>手機無法方便地直接開啟本機 HTML 檔。請將 crm.html 放到公司內網或靜態網頁空間，以 https 網址開啟；客戶資料仍只存在手機瀏覽器中，不會傳到網頁空間。</td></tr>
        <tr><td>本機伺服器</td><td>在 crm.html 所在資料夾執行 <code>python -m http.server 8000</code>，再開啟 <code>http://localhost:8000/crm.html</code>。注意：localhost 與 file:// 是不同來源，資料不共用，可用備份檔移轉。</td></tr>
      </tbody></table></div></div>
    <div class="card"><h2>📋 選項清單</h2>
      <p class="small"><b>預設產業：</b>${INDUSTRIES.map(esc).join('、')}</p>
      <div class="small"><b>自行新增的產業：</b>${customIndustries.length ? customIndustries.map(i => `<span class="badge type" style="margin:2px 4px 2px 0">${esc(i)} <button class="btn link" data-rm-ind="${esc(i)}" style="min-height:0;padding:0 2px;color:var(--danger)" aria-label="移除 ${esc(i)}">×</button></span>`).join('') : '<span class="muted">尚無</span>'}</div>
      <div class="row" style="margin:8px 0 12px;gap:6px"><input class="input" id="newInd" placeholder="輸入新產業名稱" style="max-width:240px"><button class="btn sm primary" id="addInd">＋ 新增產業</button></div>
      <p class="small muted" style="margin-top:0">移除產業選項不會變更已使用此產業的客戶資料。</p>
      <p class="small" style="margin-bottom:0"><b>地區：</b>${REGIONS.map(esc).join('、')}</p></div>
    <div class="card"><h2>⚠ 清除本機全部資料</h2>
      <p class="small muted" style="margin-top:0">將刪除此瀏覽器中的全部客戶、聯絡人與業務活動。此動作無法復原，請先匯出 Excel 備份。</p>
      <div class="row"><button class="btn" id="bkFirst">⬇ 先匯出備份</button><button class="btn danger" id="wipe">清除全部資料</button></div></div>
    <p class="small muted">${esc(APP.name)}　版本 ${APP.version}　資料結構版本 ${APP.schemaVersion}</p>`;
  $('#addInd', el).addEventListener('click', async () => {
    const r = await guard(() => addIndustry($('#newInd', el).value));
    if (r === true) { toast('已新增產業'); render(); } else if (r === false) toast('此產業已在清單中', 'warn');
  });
  $$('[data-rm-ind]', el).forEach(b => b.addEventListener('click', async () => {
    const name = b.dataset.rmInd;
    if (!await confirmDialog(`確定要從產業清單移除「${esc(name)}」嗎？\n已使用此產業的客戶資料不會變更。`, { okText: '移除' })) return;
    const ok = await guard(() => removeIndustry(name).then(() => true), '已移除產業選項'); if (ok) render();
  }));
  $('#askPersist', el).addEventListener('click', async () => {
    if (!navigator.storage || !navigator.storage.persist) return toast('此瀏覽器不支援持久保存設定', 'warn');
    try { const ok = await navigator.storage.persist(); toast(ok ? '已啟用持久保存' : '瀏覽器未同意持久保存（常用的網站通常會自動核准）', ok ? 'ok' : 'warn'); } catch (e) { toast('申請失敗：' + errMsg(e), 'err'); }
    render();
  });
  $('#bkFirst', el).addEventListener('click', async () => { const r = await guard(() => exportBackup()); if (r) { toast('備份已匯出'); render(); } });
  $('#wipe', el).addEventListener('click', async () => {
    if (!await confirmDialog('確定要清除本機<b>全部</b>客戶、聯絡人與業務活動嗎？\n此動作無法復原。', { title: '清除全部資料', okText: '下一步', danger: true })) return;
    if (!await confirmDialog('再次確認：資料清除後無法救回。\n您是否已經匯出備份？', { title: '最後確認', okText: '確定清除全部資料', danger: true })) return;
    const ok = await guard(() => DB.tx(['customers', 'contacts', 'activities'], 'readwrite', s => Promise.all([req(s.customers.clear()), req(s.contacts.clear()), req(s.activities.clear())])).then(() => Store.loadCustomers()).then(() => true), '已清除全部資料');
    if (ok) render();
  });
}

async function init() {
  buildNav();
  try {
    await DB.open();
    state.lastBackupAt = (await DB.getMeta('lastBackupAt')) || null;
    customIndustries = (await DB.getMeta('customIndustries')) || [];
    await Store.loadCustomers();
  } catch (e) {
    console.error(e);
    const env = envInfo();
    $('#content').innerHTML = `<div class="fatal"><div class="notice danger"><h2 style="font-size:18px;margin-bottom:8px">無法開啟本機資料庫</h2>
      <p>錯誤訊息：${esc(errMsg(e))}</p>
      <p>可能原因：</p><ul class="steps"><li>使用私密／無痕瀏覽模式，或瀏覽器設定封鎖了網站資料。</li>
      <li>${env.browser === 'Safari' && env.p === 'file:' ? '<b>Safari 以 file:// 開啟時可能無法使用 IndexedDB</b>，請改用 Chrome／Edge，或透過本機伺服器開啟。' : '瀏覽器版本過舊或不支援 IndexedDB。'}</li>
      <li>資料庫被其他分頁鎖定：請關閉其他 CRM 分頁。</li></ul>
      <p>為避免資料遺失，系統目前不會進行任何讀寫。</p>
      <button class="btn primary" id="retry">重新嘗試</button></div></div>`;
    $('#retry').addEventListener('click', () => location.reload());
    $('#pageTitle').textContent = '無法開啟資料庫';
    return;
  }
  window.addEventListener('hashchange', route);
  route();
}
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('發生未預期的錯誤：' + errMsg(e.reason), 'err'); });
document.addEventListener('DOMContentLoaded', init);

</script>
