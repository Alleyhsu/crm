<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-MQxK58w2amxN4roxKtEz3h7zcDLHYaJnGijzQl+Arfw='; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2747">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Systex CRM">
<title>Alley's Systex CRM</title>
<style>
:root{
  --blue:#1d4f9c;--blue-d:#163d7a;--blue-l:#e8f0fb;--navy:#0f2747;--navy-2:#16345e;
  --orange:#f08a24;--orange-d:#cf6f0f;--orange-l:#fff2e4;
  --bg:#f3f5f9;--card:#fff;--text:#1c2433;--muted:#64708a;--line:#dde3ec;--line-2:#eef1f6;
  --danger:#cf3e3e;--danger-l:#fdecec;--ok:#1d8a4e;--ok-l:#e6f5ec;--warn-l:#fff7e0;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --side:236px;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{margin:0;line-height:1.3}
.hidden{display:none!important}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#cfd9ea;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.3px}
.brand span{font-size:12px;color:#9fb1cf}
.brand i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--orange);margin-right:7px}
.nav{list-style:none;margin:0;padding:10px 8px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cfd9ea;text-decoration:none;font-size:14.5px;min-height:42px}
.nav a:hover{background:var(--navy-2);color:#fff}
.nav a.active{background:var(--blue);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.nav .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);font-size:11.5px;font-weight:700}
.nav a.active .k{background:var(--orange);color:#fff}
.nav .soon{margin-left:auto;font-size:11px;color:#8296b8;border:1px solid #3a5583;padding:0 6px;border-radius:10px}
.side-foot{padding:12px 16px;font-size:12px;color:#8ea2c4;border-top:1px solid rgba(255,255,255,.08)}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;min-height:58px}
.topbar h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .menu-btn{display:none}
.local-pill{font-size:12px;color:var(--muted);background:var(--line-2);padding:4px 10px;border-radius:20px;white-space:nowrap}
.content{padding:22px;max-width:1280px;width:100%;margin:0 auto;min-width:0}
.overlay{display:none}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;min-width:0}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .count{font-size:12px;background:var(--blue-l);color:var(--blue);padding:1px 8px;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#b9c4d6;background:#fafbfd}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.accent:hover{background:var(--orange-d)}
.btn.danger{color:var(--danger);border-color:#f0c2c2}
.btn.danger:hover{background:var(--danger-l)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--blue);padding:4px 6px;min-height:32px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:12px;white-space:nowrap;border:1px solid transparent}
.badge.active{background:var(--ok-l);color:var(--ok)}
.badge.prospect{background:var(--orange-l);color:var(--orange-d)}
.badge.archived{background:#eceff3;color:#5a6476}
.badge.overdue{background:var(--danger-l);color:var(--danger)}
.badge.today{background:var(--orange);color:#fff}
.badge.type{background:var(--blue-l);color:var(--blue)}
.notice{border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:14px;border:1px solid}
.notice.info{background:var(--blue-l);border-color:#c9daf3}
.notice.warn{background:var(--warn-l);border-color:#f1dca2}
.notice.danger{background:var(--danger-l);border-color:#f0c2c2}
.notice.ok{background:var(--ok-l);border-color:#b9e2c9}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--blue);cursor:pointer;text-align:left}
.kpi.o{border-top-color:var(--orange)}
.kpi.r{border-top-color:var(--danger)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px}
.pending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pending-grid div{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:13px;background:#fafbfd}
.pending-grid b{display:block;color:var(--text);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* toolbar & table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar .search{flex:1 1 240px;min-width:0}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:40px;background:#fff;font-size:15px}
.input:focus{outline:2px solid #9cbcec;outline-offset:0;border-color:var(--blue)}
.toolbar select.input{width:auto;min-width:120px;flex:0 1 auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{background:#f7f9fc;text-align:left;font-weight:600;color:#475268;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list th.sortable{cursor:pointer;user-select:none}
table.list th.sortable:hover{color:var(--blue)}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.list tr.clickable{cursor:pointer}
table.list tr.clickable:hover td{background:#f7faff}
table.list .name{font-weight:600;color:var(--blue)}
.sort-ind{color:var(--orange);font-size:11px}

/* detail */
.detail-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:14px}
.detail-head h2{font-size:21px;word-break:break-word}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:none;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-size:15px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;min-height:44px}
.tab.active{color:var(--blue);border-bottom-color:var(--orange);font-weight:600}
dl.info{display:grid;grid-template-columns:150px 1fr;gap:0;margin:0}
dl.info dt,dl.info dd{padding:9px 4px;border-bottom:1px solid var(--line-2);margin:0;min-width:0}
dl.info dt{color:var(--muted);font-size:14px}
dl.info dd{word-break:break-word;white-space:pre-wrap}
.follow-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--orange-l);border:1px solid #f5d2ab;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.follow-box .input{width:auto}
.item{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:#fff;min-width:0}
.item .t{font-weight:600}
.item .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.item .body{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.timeline .item{position:relative}
.timeline .item:before{content:"";position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.fu-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line-2)}
.fu-row:last-child{border-bottom:none}
.fu-row .nm{font-weight:600;color:var(--blue);cursor:pointer;min-width:0;word-break:break-word}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,26,45,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:980px}
.modal.narrow{max-width:460px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:17px;flex:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fafbfd;border-radius:0 0 12px 12px}
.x{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);width:40px;height:40px;border-radius:8px}
.x:hover{background:var(--line-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:13.5px;color:#475268;margin-bottom:5px;font-weight:600}
.field .req{color:var(--danger)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.field .err{font-size:12.5px;color:var(--danger);margin-top:4px}
.field .warn{font-size:12.5px;color:var(--orange-d);margin-top:4px}
textarea.input{min-height:90px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{margin:0;font-weight:400;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;padding:8px 14px;min-height:40px;border-right:1px solid var(--line);font-size:14px}
.seg label:last-child span{border-right:none}
.seg input:checked+span{background:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--orange)}
.section-t{font-size:14px;font-weight:700;color:var(--blue);margin:4px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.card-preview{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:#475268}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 36px))}
.toast{background:#1f2a3c;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;border-left:4px solid var(--ok);word-break:break-word}
.toast.err{border-left-color:#ff6b6b}
.toast.warn{border-left-color:var(--orange)}

/* import preview */
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.stat b{font-size:18px;display:block}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--danger)}.stat.dup b{color:var(--orange-d)}
.scroll-box{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll-box table.list td,.scroll-box table.list th{padding:6px 9px;font-size:13px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.map-grid .field label{font-weight:400}
.err-list{margin:0;padding-left:18px;font-size:13px;color:var(--danger);max-height:180px;overflow:auto}

.fatal{max-width:640px;margin:10vh auto;padding:0 18px}

/* responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:none}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .main{margin-left:0}
  .topbar .menu-btn{display:inline-flex;width:44px;height:44px;padding:0;font-size:22px}
  .two{grid-template-columns:1fr}
}
@media (max-width:640px){
  html,body{font-size:15px}
  .content{padding:14px 12px}
  .topbar{padding:8px 12px}
  .topbar h1{font-size:16.5px}
  .local-pill{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:24px}
  .card{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  .input,select.input{min-height:44px;font-size:16px}
  .toolbar select.input{flex:1 1 calc(50% - 5px);width:auto;min-width:0}
  .toolbar .btn{flex:1 1 auto}
  dl.info{grid-template-columns:1fr}
  dl.info dt{border-bottom:none;padding-bottom:0;font-size:12.5px}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none}
  .modal-f{border-radius:0;position:sticky;bottom:0}
  .modal-h{position:sticky;top:0;background:#fff;z-index:2}
  .modal-f .btn{flex:1 1 auto}
  .follow-box .input{flex:1 1 140px}
  /* table to cards */
  .tablewrap.cards{border:none;background:none;overflow:visible}
  .tablewrap.cards table,.tablewrap.cards tbody,.tablewrap.cards tr,.tablewrap.cards td{display:block;width:100%}
  .tablewrap.cards thead{display:none}
  .tablewrap.cards tr{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:8px 12px;box-shadow:var(--shadow)}
  .tablewrap.cards td{border:none;padding:3px 0;display:flex;gap:10px;font-size:14px}
  .tablewrap.cards td:before{content:attr(data-label);color:var(--muted);flex:0 0 84px;font-size:13px}
  .tablewrap.cards td.name{font-size:16px;padding-bottom:6px}
  .tablewrap.cards td.name:before{display:none}
  .tablewrap.cards td.empty-cell{display:none}
}
@media print{.sidebar,.topbar,.toolbar,.btn{display:none!important}.main{margin:0}}

/* 客戶表單內聯絡人列 */
.ct-row{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px;margin-bottom:10px;background:#fafbfd}
.ct-row-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ct-row-g{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.6fr;gap:10px}
.form-grid .section-t{margin-top:10px}
.ct-table td a{word-break:break-all}
@media (max-width:900px){.ct-row-g{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ct-row-g{grid-template-columns:1fr 1fr}.ct-row-g .field:nth-child(n+3){grid-column:1/-1}}

/* ===== SI 專案管理 ===== */
.status-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px 4px 6px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text)}
.chip b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--c);color:#fff;font-size:12px;padding:0 6px}
.chip.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent);font-weight:600}
.stepper{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.step{flex:1 1 0;min-width:84px;border:none;background:#eef1f6;color:var(--muted);padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;white-space:nowrap}
.step i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;font-size:12px;font-weight:700}
.step.done{background:var(--blue-l);color:var(--blue)}
.step.cur{background:var(--blue);color:#fff;font-weight:700;box-shadow:inset 0 -3px 0 var(--orange)}
.step.cur i{color:var(--blue)}
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.mini-kpis>div{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.mini-kpis span{display:block;font-size:12.5px;color:var(--muted)}
.mini-kpis b{font-size:16px;word-break:break-word}
.clickable-k{cursor:pointer}.clickable-k:hover{border-color:var(--blue)!important}
.progress{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok)}
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:#fff}
.todo.done{background:#f7f9fc}.todo.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-cb{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--blue)}
.todo-main{flex:1;min-width:0}.todo-text{word-break:break-word;white-space:pre-wrap}
.todo .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.todo-acts{display:flex;gap:6px;flex-wrap:wrap}
.link-pj{color:var(--blue);cursor:pointer}
.notes-view{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fcfdff;max-height:50vh;overflow:auto;font-size:14.5px}
.notes-view .nl{white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.todo-line{background:var(--orange-l);border-radius:4px;padding:1px 4px;margin:1px 0}
.todo-line.done{background:var(--ok-l);color:var(--muted);text-decoration:line-through}
.gantt-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:10px;color:var(--muted)}
.gantt-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.gantt{display:flex;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;margin-bottom:8px}
.g-names{flex:0 0 220px;border-right:1px solid var(--line);background:#fafbfd;min-width:0}
.g-head{height:34px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;padding:0 10px;position:relative;background:#f7f9fc}
.g-name{height:44px;padding:4px 10px;border-bottom:1px solid var(--line-2);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.g-name b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue)}

<body>
<!--
  Alley's Systex CRM 客戶管理系統 V1
  單一 HTML 檔案，HTML + CSS + 原生 JavaScript。
  資料儲存於本機瀏覽器 IndexedDB；不載入任何外部資源，並以 Content-Security-Policy 禁止所有網路連線。
-->
<aside class="sidebar" id="sidebar" aria-label="主選單">
  <div class="brand"><b><i></i>Alley's Systex CRM</b><span>客戶管理系統 V1</span></div>
  <ul class="nav" id="nav"></ul>
  <div class="side-foot">🔒 資料僅存於本機瀏覽器<br>請定期匯出備份</div>
</aside>
<div class="overlay" id="overlay"></div>
<div class="main">
  <header class="topbar">
    <button class="btn menu-btn" id="menuBtn" aria-label="開啟選單">☰</button>
    <h1 id="pageTitle">載入中…</h1>
    <span class="local-pill">本機儲存・不連網</span>
  </header>
  <main class="content" id="content"><div class="empty">載入中…</div></main>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript><div class="fatal"><div class="notice danger">本系統需要啟用 JavaScript 才能使用。</div></div></noscript>
<script>
'use strict';
/* ============================================================
 * Alley's Systex CRM V1 — 核心：常數、工具、資料庫、服務
 * 所有資料僅存於本機瀏覽器 IndexedDB，程式不發出任何網路請求。
 * ============================================================ */
const APP = { name: "Alley's Systex CRM", version: '1.2.0', schemaVersion: 3, dbName: 'alley_systex_crm', dbVersion: 3 };

const INDUSTRIES = ['公部門', '工具機', '半導體', '設備機械', '手工具', '自行車', '塑膠射出', '五金加工', '建築', '醫療單位', '化妝品', '家居行業', '零售業'];
const REGIONS = ['基隆市', '臺北市', '新北市', '桃園市', '新竹市', '新竹縣', '苗栗縣', '臺中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '臺南市', '高雄市', '屏東縣', '宜蘭縣', '花蓮縣', '臺東縣', '澎湖縣', '金門縣', '連江縣'];
const ACT_TYPES = ['電話', '拜訪', 'Email', '視訊會議'];
let customIndustries = []; // 使用者自行新增的產業選項（存於 meta.customIndustries）
/** 產業下拉清單：預設 + 自行新增 +（選擇性）資料中已使用的其他產業 */
function industryList(includeUsed) {
  const list = INDUSTRIES.concat(customIndustries.filter(i => !INDUSTRIES.includes(i)));
  if (includeUsed && typeof Store !== 'undefined') for (const c of Store.customers) if (c.industry && !list.includes(c.industry)) list.push(c.industry);
  return list;
}
async function addIndustry(name) {
  const v = String(name || '').trim();
  if (!v) throw new Error('請輸入產業名稱');
  if (v.length > 20) throw new Error('產業名稱請在 20 字以內');
  if (industryList().includes(v)) return false;
  const next = customIndustries.concat([v]);
  await DB.setMeta('customIndustries', next);
  customIndustries = next;
  return true;
}
async function removeIndustry(name) {
  const next = customIndustries.filter(i => i !== name);
  await DB.setMeta('customIndustries', next);
  customIndustries = next;
}

/* ---------- 一般工具 ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') {
    try { return crypto.randomUUID(); } catch (e) { /* 非安全環境時改用下方方式 */ }
  }
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const pad2 = n => String(n).padStart(2, '0');
function todayStr(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function nowLocalDT(d = new Date()) { return `${todayStr(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function addDays(dateStr, n) { const [y, m, d] = dateStr.split('-').map(Number); return todayStr(new Date(y, m - 1, d + n)); }
function nowISO() { return new Date().toISOString(); }
function fmtDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return `${todayStr(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtActDT(v) { return v ? String(v).replace('T', ' ') : ''; }
function fmtMoney(v) {
  if (v === '' || v == null) return '';
  const n = Number(String(v).replace(/,/g, ''));
  return isNaN(n) ? String(v) : n.toLocaleString('zh-TW') + ' 元';
}
function daysBetween(a, b) { // b - a, 以日計
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
}
function normTW(s) { return String(s || '').replace(/台/g, '臺'); }
function normName(s) {
  return String(s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '')
    .replace(/台/g, '臺').replace(/(股份有限公司|有限公司|股份公司|公司)$/, '');
}
/** 將各種日期寫法轉為 YYYY-MM-DD；無法解析回傳 null；空白回傳 '' */
function parseDate(v) {
  if (v == null) return '';
  if (typeof v === 'number') return excelSerialToDate(v);
  let s = String(v).trim().normalize('NFKC');
  if (!s) return '';
  if (/^\d{5}(\.\d+)?$/.test(s)) return excelSerialToDate(Number(s));
  let m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?/);
  if (!m) {
    m = s.match(/^(\d{2,3})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/); // 民國年
    if (m) m = [m[0], String(Number(m[1]) + 1911), m[2], m[3]];
  }
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
/** 日期時間 → YYYY-MM-DDTHH:mm；只有日期時補 09:00 */
function parseDateTime(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())) {
    const n = Number(v); const d = parseDate(Math.floor(n)); if (!d) return null;
    const mins = Math.round((n - Math.floor(n)) * 1440);
    return `${d}T${pad2(Math.floor(mins / 60) % 24)}:${pad2(mins % 60)}`;
  }
  const s = String(v).trim().normalize('NFKC');
  const m = s.match(/^(.+?)[T\s]+(\d{1,2}):(\d{2})/);
  if (m) {
    const d = parseDate(m[1]); if (!d) return null;
    const h = Number(m[2]), mi = Number(m[3]); if (h > 23 || mi > 59) return null;
    return `${d}T${pad2(h)}:${pad2(mi)}`;
  }
  const d = parseDate(s); if (!d) return null;
  return `${d}T09:00`;
}
function excelSerialToDate(n) {
  if (!(n > 0 && n < 2958466)) return null;
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
}
function parseBool(v) {
  const s = String(v == null ? '' : v).trim().toLowerCase();
  if (['是', 'y', 'yes', 'true', '1', '服務中', 'v', '✓'].includes(s)) return true;
  if (['否', 'n', 'no', 'false', '0', '潛在', '潛在客戶', ''].includes(s)) return false;
  return null;
}
/** 統一編號檢查（含 2023 年起「可被 5 整除」新制） */
function checkTaxId(id) {
  if (!id) return { ok: true, empty: true };
  if (!/^\d{8}$/.test(id)) return { ok: false, format: false, msg: '統一編號須為 8 位數字' };
  const w = [1, 2, 1, 2, 1, 2, 4, 1];
  let sum = 0;
  for (let i = 0; i < 8; i++) { const p = Number(id[i]) * w[i]; sum += Math.floor(p / 10) + (p % 10); }
  const valid = sum % 5 === 0 || (id[6] === '7' && (sum + 1) % 5 === 0);
  return valid ? { ok: true, format: true } : { ok: false, format: true, msg: '統一編號檢查碼不符，請再確認（仍可儲存）' };
}
function isEmail(s) { return !s || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
function isUrlLike(s) { return !s || /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(s); }
function regionFromAddress(addr) {
  const a = normTW(addr);
  return REGIONS.find(r => a.includes(r)) || '';
}

/* ---------- 提示訊息 ---------- */
function toast(msg, kind = 'ok', ms = 3500) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : '');
  el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? Math.max(ms, 6000) : ms);
}
function errMsg(e) {
  if (!e) return '未知錯誤';
  const n = e.name || '';
  if (n === 'QuotaExceededError') return '瀏覽器儲存空間不足，資料未儲存。請先匯出備份並清理瀏覽器空間。';
  if (n === 'ConstraintError') return '資料識別碼重複，未儲存。';
  if (n === 'InvalidStateError') return '資料庫連線已中斷，請重新整理頁面。';
  if (n === 'VersionError') return '此瀏覽器中的資料庫版本比本系統新，請使用最新版 crm.html。';
  return (e.message || String(e));
}

/* ============================================================
 * IndexedDB
 * ============================================================ */
const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) {
        reject(new Error('此瀏覽器不支援 IndexedDB，或已被停用（例如部分瀏覽器的私密模式，或 Safari 以 file:// 開啟）。'));
        return;
      }
      let req;
      try { req = indexedDB.open(APP.dbName, APP.dbVersion); }
      catch (e) { reject(e); return; }
      req.onupgradeneeded = ev => {
        const db = req.result;
        if (ev.oldVersion < 1) {
          const c = db.createObjectStore('customers', { keyPath: 'id' });
          c.createIndex('name', 'name'); c.createIndex('taxId', 'taxId');
          const ct = db.createObjectStore('contacts', { keyPath: 'id' });
          ct.createIndex('customerId', 'customerId');
          const a = db.createObjectStore('activities', { keyPath: 'id' });
          a.createIndex('customerId', 'customerId'); a.createIndex('datetime', 'datetime');
          db.createObjectStore('meta', { keyPath: 'key' });
        }
        if (ev.oldVersion >= 1 && ev.oldVersion < 2) {
          // V1.1：「公司地址」改為「公司註冊地址」，並新增聯絡地址、公司電話、傳真
          const store = req.transaction.objectStore('customers');
          store.openCursor().onsuccess = e => {
            const cur = e.target.result; if (!cur) return;
            const c = cur.value;
            if (c.regAddress === undefined) c.regAddress = c.address || '';
            if (c.contactAddress === undefined) c.contactAddress = '';
            if (c.phone === undefined) c.phone = '';
            if (c.fax === undefined) c.fax = '';
            delete c.address;
            cur.update(c); cur.continue();
          };
        }
        if (ev.oldVersion < 3) {
          // V1.2：SI 專案管理
          const p = db.createObjectStore('projects', { keyPath: 'id' });
          p.createIndex('customerId', 'customerId'); p.createIndex('status', 'status');
          const mt = db.createObjectStore('meetings', { keyPath: 'id' });
          mt.createIndex('projectId', 'projectId');
          const td = db.createObjectStore('todos', { keyPath: 'id' });
          td.createIndex('projectId', 'projectId');
        }
      };
      req.onblocked = () => toast('資料庫正被其他分頁使用中，請關閉其他 CRM 分頁後重新整理。', 'warn', 8000);
      req.onerror = () => reject(req.error || new Error('無法開啟資料庫'));
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { this.db.close(); toast('資料庫已在其他分頁更新，請重新整理此頁面。', 'warn', 10000); };
        resolve(this.db);
      };
    });
  },
  /** 在單一 transaction 中執行 fn(stores)；任何錯誤都會整筆回復 */
  tx(storeNames, mode, fn) {
    return new Promise((resolve, reject) => {
      let t, result;
      try { t = this.db.transaction(storeNames, mode); }
      catch (e) { reject(e); return; }
      const stores = {};
      [].concat(storeNames).forEach(n => { stores[n] = t.objectStore(n); });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('資料庫交易已中止，資料未變更'));
      Promise.resolve().then(() => fn(stores, t)).then(r => { result = r; }).catch(e => {
        try { t.abort(); } catch (x) { /* 已結束 */ }
        reject(e);
      });
    });
  },
  getAll(store) { return this.tx(store, 'readonly', s => req(s[store].getAll())); },
  get(store, key) { return this.tx(store, 'readonly', s => req(s[store].get(key))); },
  byIndex(store, index, key) { return this.tx(store, 'readonly', s => req(s[store].index(index).getAll(key))); },
  async getMeta(key) { const r = await this.get('meta', key); return r ? r.value : undefined; },
  setMeta(key, value) { return this.tx('meta', 'readwrite', s => req(s.meta.put({ key, value }))); }
};
function req(r) {
  return new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
}

/* ============================================================
 * 資料服務
 * ============================================================ */
const CUSTOMER_FIELDS = ['isActive', 'name', 'industry', 'taxId', 'owner', 'capital', 'region', 'regAddress', 'contactAddress', 'phone', 'fax', 'website', 'msDomain', 'createdDate', 'lastContactDate', 'nextFollowUpDate', 'note', 'archived'];
const CONTACT_FIELDS = ['name', 'department', 'title', 'phone', 'mobile', 'email', 'note'];

function blankCustomer() {
  return { id: '', isActive: false, name: '', industry: '', taxId: '', owner: '', capital: '', region: '', regAddress: '', contactAddress: '', phone: '', fax: '', website: '', msDomain: '', createdDate: todayStr(), lastContactDate: '', nextFollowUpDate: '', note: '', createdAt: '', updatedAt: '', archived: false, archivedAt: '' };
}
function cleanCustomer(c) {
  const o = blankCustomer();
  for (const k of Object.keys(o)) if (c[k] !== undefined && c[k] !== null) o[k] = c[k];
  for (const k of ['name', 'industry', 'taxId', 'owner', 'region', 'regAddress', 'contactAddress', 'phone', 'fax', 'website', 'msDomain', 'note']) o[k] = String(o[k]).trim();
  o.capital = String(o.capital).replace(/[,\s元]/g, '').trim();
  o.region = normTW(o.region);
  o.isActive = !!o.isActive; o.archived = !!o.archived;
  return o;
}

const Store = {
  customers: [], // 快取：每次寫入後由 IndexedDB 重新讀取
  contactsByCustomer: new Map(), // 快取：客戶ID → 聯絡人陣列（清單顯示與搜尋用）
  async loadCustomers() {
    const [cs, cts] = await DB.tx(['customers', 'contacts'], 'readonly', s => Promise.all([req(s.customers.getAll()), req(s.contacts.getAll())]));
    this.customers = cs;
    const m = new Map();
    for (const ct of cts.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))) { if (!m.has(ct.customerId)) m.set(ct.customerId, []); m.get(ct.customerId).push(ct); }
    this.contactsByCustomer = m;
    return this.customers;
  },
  customer(id) { return this.customers.find(c => c.id === id); },

  async saveCustomer(data) {
    const c = cleanCustomer(data);
    if (!c.name) throw new Error('客戶名稱為必填');
    const now = nowISO();
    if (!data.id) { c.id = uid(); c.createdAt = now; }
    else {
      const old = await DB.get('customers', data.id);
      if (!old) throw new Error('找不到此客戶，可能已被刪除');
      c.id = old.id; c.createdAt = old.createdAt; c.lastContactDate = old.lastContactDate;
      c.archived = old.archived; c.archivedAt = old.archivedAt || '';
    }
    c.updatedAt = now;
    await DB.tx('customers', 'readwrite', s => req(s.customers.put(c)));
    await this.loadCustomers();
    maybePersist();
    return c;
  },
  /** 儲存客戶並同步儲存表單中的聯絡人（新增／修改／刪除），單一交易完成 */
  async saveCustomerWithContacts(data, contacts = [], deleteIds = []) {
    const c = cleanCustomer(data);
    if (!c.name) throw new Error('客戶名稱為必填');
    const now = nowISO();
    // 只更新表單上有的欄位；未出現在表單的欄位（例如部門、備註）保留原值
    const rows = contacts.map(x => { const o = { id: x.id || '' }; for (const k of CONTACT_FIELDS) if (k in x) o[k] = String(x[k] == null ? '' : x[k]).trim(); return o; })
      .filter(o => o.id || CONTACT_FIELDS.some(k => o[k]));
    for (const o of rows) {
      if (!o.name) throw new Error('聯絡人姓名為必填（有填電話或信箱的聯絡人列，請填寫姓名）');
      if (!isEmail(o.email || '')) throw new Error(`聯絡人「${o.name}」的電子郵件格式不正確`);
    }
    await DB.tx(['customers', 'contacts'], 'readwrite', async s => {
      if (!data.id) { c.id = uid(); c.createdAt = now; }
      else {
        const old = await req(s.customers.get(data.id));
        if (!old) throw new Error('找不到此客戶，可能已被刪除');
        c.id = old.id; c.createdAt = old.createdAt; c.lastContactDate = old.lastContactDate;
        c.archived = old.archived; c.archivedAt = old.archivedAt || '';
      }
      c.updatedAt = now;
      await req(s.customers.put(c));
      for (const id of deleteIds) {
        const old = await req(s.contacts.get(id));
        if (old && old.customerId !== c.id) throw new Error('聯絡人不屬於此客戶，已取消儲存');
        if (old) s.contacts.delete(id);
      }
      let seq = 0; const base = Date.now();
      for (const o of rows) {
        if (o.id) {
          const old = await req(s.contacts.get(o.id));
          if (!old) throw new Error(`找不到聯絡人「${o.name}」，可能已被刪除`);
          if (old.customerId !== c.id) throw new Error('聯絡人不屬於此客戶，已取消儲存');
          await req(s.contacts.put(Object.assign(old, o, { updatedAt: now })));
        } else {
          const blank = {}; for (const k of CONTACT_FIELDS) blank[k] = '';
          await req(s.contacts.put(Object.assign(blank, o, { id: uid(), customerId: c.id, createdAt: new Date(base + seq++).toISOString(), updatedAt: now }))); // 依表單順序排列
        }
      }
    });
    await this.loadCustomers();
    maybePersist();
    return c;
  },
  async patchCustomer(id, patch) {
    await DB.tx('customers', 'readwrite', async s => {
      const c = await req(s.customers.get(id));
      if (!c) throw new Error('找不到此客戶');
      Object.assign(c, patch, { updatedAt: nowISO() });
      await req(s.customers.put(c));
    });
    await this.loadCustomers();
  },
  setArchived(id, archived) { return this.patchCustomer(id, { archived, archivedAt: archived ? nowISO() : '' }); },
  setFollowUp(id, date) { return this.patchCustomer(id, { nextFollowUpDate: date || '' }); },

  /** 永久刪除客戶（含其聯絡人與活動），單一交易 */
  async deleteCustomer(id) {
    const r = await DB.tx(['customers', 'contacts', 'activities', 'projects'], 'readwrite', async s => {
      const c = await req(s.customers.get(id));
      if (!c) throw new Error('找不到此客戶');
      if (!c.archived) throw new Error('只能刪除已封存的客戶');
      const pj = await req(s.projects.index('customerId').count(id));
      if (pj) throw new Error(`此客戶仍有 ${pj} 個 SI 專案，請先刪除這些專案後再刪除客戶`);
      const cts = await req(s.contacts.index('customerId').getAllKeys(id));
      const acts = await req(s.activities.index('customerId').getAllKeys(id));
      for (const k of cts) s.contacts.delete(k);
      for (const k of acts) s.activities.delete(k);
      s.customers.delete(id);
      return { contacts: cts.length, activities: acts.length };
    });
    await this.loadCustomers();
    return r;
  },

  contactsOf(customerId) { return DB.byIndex('contacts', 'customerId', customerId); },
  async saveContact(data) {
    const now = nowISO();
    const o = { id: data.id || uid(), customerId: data.customerId };
    for (const k of CONTACT_FIELDS) o[k] = String(data[k] || '').trim();
    if (!o.name) throw new Error('聯絡人姓名為必填');
    if (!o.customerId) throw new Error('缺少所屬客戶');
    await DB.tx(['customers', 'contacts'], 'readwrite', async s => {
      const cust = await req(s.customers.get(o.customerId));
      if (!cust) throw new Error('所屬客戶不存在');
      if (data.id) {
        const old = await req(s.contacts.get(data.id));
        if (!old) throw new Error('找不到此聯絡人');
        if (old.customerId !== o.customerId) throw new Error('聯絡人不屬於此客戶，已取消儲存');
        o.createdAt = old.createdAt;
      } else o.createdAt = now;
      o.updatedAt = now;
      await req(s.contacts.put(o));
    });
    await this.loadCustomers();
    return o;
  },
  /** 刪除聯絡人：同時核對所屬客戶，避免誤刪其他客戶資料 */
  async deleteContact(id, customerId) {
    await DB.tx('contacts', 'readwrite', async s => {
      const old = await req(s.contacts.get(id));
      if (!old) throw new Error('找不到此聯絡人');
      if (old.customerId !== customerId) throw new Error('聯絡人不屬於此客戶，已取消刪除');
      await req(s.contacts.delete(id));
    });
    await this.loadCustomers();
  },

  async activitiesOf(customerId) {
    const list = await DB.byIndex('activities', 'customerId', customerId);
    return sortActs(list);
  },
  async allActivities() { return sortActs(await DB.getAll('activities')); },

  /** 新增/編輯活動：同一交易內重新計算最後聯絡日期，並更新下次跟進日期 */
  async saveActivity(data) {
    const now = nowISO();
    const o = {
      id: data.id || uid(), customerId: data.customerId, contactId: data.contactId || '',
      contactName: String(data.contactName || '').trim(), type: data.type, datetime: data.datetime,
      content: String(data.content || '').trim(), nextFollowUpDate: data.nextFollowUpDate || ''
    };
    if (!o.customerId) throw new Error('請選擇客戶');
    if (!ACT_TYPES.includes(o.type)) throw new Error('請選擇拜訪類型');
    if (!parseDateTime(o.datetime)) throw new Error('請輸入正確的拜訪日期及時間');
    let info = {};
    await DB.tx(['customers', 'contacts', 'activities'], 'readwrite', async s => {
      const cust = await req(s.customers.get(o.customerId));
      if (!cust) throw new Error('所屬客戶不存在');
      if (o.contactId) {
        const ct = await req(s.contacts.get(o.contactId));
        if (!ct || ct.customerId !== o.customerId) throw new Error('所選聯絡人不屬於此客戶');
        o.contactName = ct.name;
      }
      if (data.id) {
        const old = await req(s.activities.get(data.id));
        if (!old) throw new Error('找不到此活動紀錄');
        if (old.customerId !== o.customerId) throw new Error('活動不屬於此客戶');
        o.createdAt = old.createdAt;
      } else o.createdAt = now;
      o.updatedAt = now;
      await req(s.activities.put(o));
      const all = await req(s.activities.index('customerId').getAll(o.customerId));
      cust.lastContactDate = latestDate(all);
      if (o.nextFollowUpDate) { cust.nextFollowUpDate = o.nextFollowUpDate; info.followUpUpdated = true; }
      cust.updatedAt = now;
      await req(s.customers.put(cust));
    });
    await this.loadCustomers();
    return Object.assign(o, info);
  },
  async deleteActivity(id, customerId) {
    await DB.tx(['customers', 'activities'], 'readwrite', async s => {
      const old = await req(s.activities.get(id));
      if (!old) throw new Error('找不到此活動紀錄');
      if (old.customerId !== customerId) throw new Error('活動不屬於此客戶，已取消刪除');
      await req(s.activities.delete(id));
      const cust = await req(s.customers.get(customerId));
      if (cust) {
        const rest = await req(s.activities.index('customerId').getAll(customerId));
        cust.lastContactDate = latestDate(rest);
        if (old.nextFollowUpDate && cust.nextFollowUpDate === old.nextFollowUpDate) {
          const latest = sortActs(rest)[0];
          cust.nextFollowUpDate = latest ? (latest.nextFollowUpDate || '') : '';
        }
        cust.updatedAt = nowISO();
        await req(s.customers.put(cust));
      }
    });
    await this.loadCustomers();
  },

  stats() {
    const t = todayStr();
    const live = this.customers.filter(c => !c.archived);
    return {
      total: live.length,
      active: live.filter(c => c.isActive).length,
      prospect: live.filter(c => !c.isActive).length,
      today: live.filter(c => c.nextFollowUpDate === t).length,
      overdue: live.filter(c => c.nextFollowUpDate && c.nextFollowUpDate < t).length,
      archived: this.customers.length - live.length
    };
  },
  findDuplicates(c, excludeId) {
    const nn = normName(c.name);
    return this.customers.filter(x => x.id !== excludeId && ((c.taxId && x.taxId === c.taxId) || (nn && normName(x.name) === nn)));
  }
};
function sortActs(list) { return list.slice().sort((a, b) => (b.datetime || '').localeCompare(a.datetime || '') || (b.createdAt || '').localeCompare(a.createdAt || '')); }
function latestDate(acts) {
  let m = '';
  for (const a of acts) if (a.datetime && a.datetime > m) m = a.datetime;
  return m ? m.slice(0, 10) : '';
}

/* ---------- 對話框 ---------- */
const modalStack = [];
function openModal({ title, body, footer = '', size = '', onClose }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="關閉">×</button></div>
    <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const m = { el: bg, closed: false, close() {
    if (m.closed) return; m.closed = true; bg.remove();
    const i = modalStack.indexOf(m); if (i >= 0) modalStack.splice(i, 1);
    if (!modalStack.length) document.body.style.overflow = '';
    onClose && onClose();
  } };
  modalStack.push(m);
  bg.addEventListener('click', e => { if (e.target.closest('[data-close]')) m.close(); });
  setTimeout(() => { const f = bg.querySelector('[autofocus]') || bg.querySelector('.modal-b input:not([type=hidden]):not([type=radio]):not([type=file]),.modal-b textarea'); if (f && window.innerWidth > 640 && !bg.contains(document.activeElement)) f.focus(); }, 30);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); });

function confirmDialog(message, { title = '請確認', okText = '確定', danger = false, cancelText = '取消' } = {}) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({
      title, size: 'narrow',
      body: `<div style="white-space:pre-wrap">${message}</div>`,
      footer: `<button class="btn" data-close>${esc(cancelText)}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-ok autofocus>${esc(okText)}</button>`,
      onClose: () => { if (!done) resolve(false); }
    });
    m.el.querySelector('[data-ok]').addEventListener('click', () => { done = true; m.close(); resolve(true); });
  });
}
async function guard(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { console.error(e); toast('操作失敗：' + errMsg(e), 'err'); return undefined; }
}

function buildNav() {
  $('#nav').innerHTML = Object.entries(PAGES).map(([id, p]) =>
    `<li><a href="#/${id}" data-page="${id}"><span class="k">${p.k}</span>${esc(p.t)}${p.soon ? '<span class="soon">開發中</span>' : ''}</a></li>`).join('');
  $('#nav').addEventListener('click', e => {
    const a = e.target.closest('a[data-page]'); if (!a) return;
    if (location.hash === '#/' + a.dataset.page) { e.preventDefault(); route(); } // 同頁時（例如在客戶詳細頁）也要回到清單
  });
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));
}
function go(page) {
  if (location.hash !== '#/' + page) location.hash = '#/' + page; else route();
}
function route() {
  const p = (location.hash.match(/^#\/(\w+)/) || [])[1];
  state.page = PAGES[p] ? p : 'dashboard';
  state.detailId = null; state.projectId = null;
  document.body.classList.remove('nav-open');
  render();
}
async function render() {
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === state.page));
  const title = state.detailId ? '客戶詳細資料' : PAGES[state.page].t;
  $('#pageTitle').textContent = title;
  document.title = `${title}｜${APP.name}`;
  const el = $('#content');
  try {
    if (state.page === 'customers' && state.detailId) await renderDetail(el);
    else await ({ dashboard: renderDashboard, customers: renderCustomers, activities: renderActivities, si: renderSI, data: renderData, settings: renderSettings }[state.page] || renderSoon)(el);
  } catch (e) {
    console.error(e);
    el.innerHTML = `<div class="notice danger">頁面載入失敗：${esc(errMsg(e))}</div>`;
  }
  window.scrollTo(0, 0);
}
function openCustomer(id, tab = 'info') {
  state.page = 'customers'; state.detailId = id; state.detailTab = tab; state.projectId = null;
  if (location.hash !== '#/customers') { history.replaceState(null, '', '#/customers'); }
  render();
}

  const t = todayStr();

  if (date === t) return `<span class="badge today">今天</span>`;
  return esc(date);
}

 * B. 客戶管理：清單
 * ============================================================ */
const SORTS = { name: '客戶名稱', industry: '產業', region: '地區', lastContactDate: '最後聯絡', nextFollowUpDate: '下次跟進', createdDate: '建檔日期', updatedAt: '最後修改' };
function filteredCustomers() {
  const f = state.f;
  const q = f.q.trim().toLowerCase().normalize('NFKC').replace(/台/g, '臺');
  let list = Store.customers.filter(c => {
    if (f.view === 'live' && c.archived) return false;
    if (f.view === 'archived' && !c.archived) return false;
    if (f.industry && c.industry !== f.industry) return false;
    if (f.status === 'active' && !c.isActive) return false;
    if (f.status === 'prospect' && c.isActive) return false;
    if (f.region && c.region !== f.region) return false;
    if (q) {
      const cts = Store.contactsByCustomer.get(c.id) || [];
      const hay = [c.name, c.taxId, c.phone, ...cts.map(x => [x.name, x.phone, x.mobile, x.email].join(' '))].join(' ').toLowerCase().normalize('NFKC').replace(/台/g, '臺');
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const k = f.sort, dir = f.dir === 'asc' ? 1 : -1;
  list.sort((a, b) => {
    const x = a[k] || '', y = b[k] || '';
    if (!x && y) return 1; if (x && !y) return -1; // 空值排最後
    return (k === 'name' || k === 'industry' || k === 'region' ? String(x).localeCompare(String(y), 'zh-Hant') : String(x).localeCompare(String(y))) * dir;
  });
  return list;
}

function bindCustomerFields(root, prefix, excludeId) {
  bindIndustry(root, prefix);
  const tax = $(`#${prefix}_taxId`, root), taxMsg = $(`#${prefix}_taxId_msg`, root);
  const checkTax = () => {
    tax.value = tax.value.normalize('NFKC').replace(/\D/g, '').slice(0, 8);
    const r = checkTaxId(tax.value);
    taxMsg.classList.toggle('hidden', r.ok); taxMsg.textContent = r.ok ? '' : r.msg;
    checkDup();
  };
  const name = $(`#${prefix}_name`, root), dup = $(`#${prefix}_dup`, root);
  const checkDup = () => {
    const d = Store.findDuplicates({ name: name.value, taxId: tax.value }, excludeId);
    dup.classList.toggle('hidden', !d.length);
    dup.textContent = d.length ? `⚠ 可能重複：已有「${d.map(x => x.name + (x.archived ? '（已封存）' : '')).join('、')}」` : '';
  };
  tax.addEventListener('input', checkTax); name.addEventListener('input', checkDup);
  const regA = $(`#${prefix}_regAddress`, root), conA = $(`#${prefix}_contactAddress`, root), same = $(`#${prefix}_sameAddr`, root), reg = $(`#${prefix}_region`, root);
  const autoRegion = v => { if (!reg.value) { const r = regionFromAddress(v); if (r) reg.value = r; } };
  const syncSame = () => { if (same.checked) conA.value = regA.value; conA.readOnly = same.checked; };
  same.checked = !!regA.value && regA.value === conA.value;
  syncSame();
  same.addEventListener('change', syncSame);
  regA.addEventListener('input', () => { if (same.checked) conA.value = regA.value; });
  regA.addEventListener('change', () => autoRegion(regA.value));
  conA.addEventListener('change', () => autoRegion(conA.value));
  checkTax();
}
function readCustomerFields(root, prefix) {
  const v = id => ($(`#${prefix}_${id}`, root) || {}).value || '';
  const ind = v('industry');
  return {
    isActive: ($(`input[name=${prefix}_isActive]:checked`, root) || {}).value === '1',
    name: v('name').trim(), industry: ind === '__other' ? v('industryOther').trim() : ind,
    taxId: v('taxId').trim(), owner: v('owner'), capital: v('capital'), region: v('region'),
    phone: v('phone').trim(), fax: v('fax').trim(), regAddress: v('regAddress'), contactAddress: v('contactAddress'),
    website: v('website').trim(), msDomain: v('msDomain').trim(), createdDate: v('createdDate') || todayStr(),
    nextFollowUpDate: v('nextFollowUpDate'), note: v('note')
  };

function validateCustomer(root, prefix, d) {
  const err = $(`#${prefix}_name_err`, root);
  if (!d.name) { err.textContent = '請輸入客戶名稱'; err.classList.remove('hidden'); $(`#${prefix}_name`, root).focus(); return false; }
  err.classList.add('hidden');
  if (d.taxId && !/^\d{8}$/.test(d.taxId)) { toast('統一編號須為 8 位數字', 'warn'); return false; }

function bindContactsSection(root, removed) {
  const rows = $('#ctRows', root);
  const renumber = () => { $$('.ct-row', rows).forEach((r, i) => { $('.ct-no', r).textContent = '聯絡人 ' + (i + 1); }); $('#ctCount', root).textContent = $$('.ct-row', rows).length; };
  rows.addEventListener('click', e => {
    const b = e.target.closest('[data-ct-remove]'); if (!b) return;

  });

function readContactRows(root) {
  let ok = true; const out = [];
  $$('#ctRows .ct-row', root).forEach(row => {
    const o = { id: row.dataset.ctId || '' };
    $$('[data-k]', row).forEach(i => { o[i.dataset.k] = i.value.trim(); });
    const err = $('[data-ct-err]', row); let msg = '';
    const any = QUICK_CT.some(([k]) => o[k]);
    if (!any && !o.id) return; // 空白列忽略
    if (!o.name) msg = '請填寫聯絡人姓名';
    else if (!isEmail(o.email)) msg = '電子郵件格式不正確';
    err.textContent = msg; err.classList.toggle('hidden', !msg);
    if (msg) ok = false;
    out.push(o);
  });
  return ok ? out : null;
}

async function customerForm(existing) {
  const c = existing ? Object.assign({}, existing) : blankCustomer();
  const contacts = existing ? (await Store.contactsOf(c.id)).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')) : [{}];
  const removed = [];
  const m = openModal({
    title: existing ? '編輯客戶' : '新增客戶', size: 'wide',
    body: `<form id="cf" class="form-grid" novalidate>${customerFields(c, 'c')}${contactsSectionHtml(contacts)}</form>`,
    footer: `<button class="btn" data-close>取消</button><button class="btn primary" data-save>儲存</button>`
  });
  if (!existing) $('#ctCount', m.el).textContent = '1';
  bindCustomerFields(m.el, 'c', c.id);
  bindContactsSection(m.el, removed);
  const save = async () => {
    const d = readCustomerFields(m.el, 'c');
    if (!validateCustomer(m.el, 'c', d)) return;
    const cts = readContactRows(m.el);
    if (!cts) { toast('聯絡人資料有誤，請依紅字修正', 'warn'); const e = $('[data-ct-err]:not(.hidden)', m.el); if (e) e.scrollIntoView({ block: 'center' }); return; }
    const dups = Store.findDuplicates(d, c.id);
    if (dups.length && !await confirmDialog(`系統中已有相似的客戶：\n${dups.map(x => '・' + esc(x.name) + (x.taxId ? `（統編 ${esc(x.taxId)}）` : '')).join('\n')}\n\n仍要儲存為${existing ? '' : '一筆新的'}客戶嗎？`, { okText: '仍要儲存' })) return;
    if (removed.length && !await confirmDialog(`將刪除以下聯絡人：\n${removed.map(r => '・' + esc(r.name || '（未命名）')).join('\n')}\n\n已記錄的業務活動會保留姓名。確定要儲存嗎？`, { okText: '確定儲存', danger: true })) return;
    if (existing) d.id = c.id;
    const saved = await guard(() => Store.saveCustomerWithContacts(d, cts, removed.map(r => r.id)), existing ? '客戶資料已更新' : (cts.length ? `客戶已新增（含 ${cts.length} 位聯絡人）` : '客戶已新增'));
    if (saved) { m.close(); openCustomer(saved.id); }
  };
  $('[data-save]', m.el).addEventListener('click', save);
  $('#cf', m.el).addEventListener('submit', e => { e.preventDefault(); save(); });
}

    </div>
    <div class="card"><h2>未來 7 天待跟進 <span class="count">${soon.length}</span></h2>${fuList(soon, '未來 7 天沒有排定跟進')}</div>
    <div class="card"><h2>全部業務活動</h2>

      <div id="alist"></div></div>`;
  bindFuList(el);
  $('#newAct', el).addEventListener('click', () => activityForm({}));
  const all = await Store.allActivities();
  const draw = () => {
    const k = state.actQ.trim().toLowerCase();
    const list = all.filter(a => {
      if (state.actType && a.type !== state.actType) return false;

    });
    const shown = list.slice(0, 200);
    $('#alist', el).innerHTML = list.length ? `<p class="muted small" style="margin-top:0">共 ${list.length} 筆${list.length > 200 ? '（顯示最新 200 筆，請用搜尋縮小範圍）' : ''}，依日期由新到舊</p><div class="timeline">${shown.map(a => actItem(a, null, true)).join('')}</div>` : '<div class="empty">沒有符合的活動紀錄</div>';
    bindActItems($('#alist', el), shown);

  $('#aq', el).addEventListener('input', e => { state.actQ = e.target.value; draw(); });
  $('#atype', el).addEventListener('change', e => { state.actType = e.target.value; draw(); });
  draw();

/* ============================================================
 * 檔案處理：ZIP / XLSX / CSV（自行實作，不使用外部套件）
 * ============================================================ */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  const stream = new Blob([data]).stream().pipeThrough(transform);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function zipFiles(files) { // files: [{name, data: string|Uint8Array}]

  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const nameB = enc.encode(f.name);
    const raw = typeof f.data === 'string' ? enc.encode(f.data) : f.data;

// 由系統產生或可省略的欄位：匯入範本中可不提供，不顯示缺欄警告
const OPTIONAL_COLS = new Set(['id', 'phone', 'fax', 'contactAddress', 'createdAt', 'updatedAt', 'archivedAt', 'archived', 'lastContactDate', 'contactId']);
const HEADER_ALIASES = { '公司註冊地址': ['公司地址'] };
function rowsToObjects(rows, cols) {
  if (!rows.length) return { list: [], missing: cols.map(c => c[0]) };
  const header = rows[0].map(h => String(h).trim());
  // 相容舊版備份：V1.0「公司地址」對應到「公司註冊地址」
  const idx = cols.map(([h]) => { const i = header.indexOf(h); return i >= 0 ? i : (HEADER_ALIASES[h] || []).map(a => header.indexOf(a)).find(x => x >= 0) ?? -1; });
  const missing = cols.filter((c, i) => idx[i] < 0 && c[2] !== 'ref' && !OPTIONAL_COLS.has(c[1])).map(c => c[0]);
  const list = rows.slice(1).map((r, n) => {
    const o = { _row: n + 2 };
    cols.forEach(([, k], i) => { o[k] = idx[i] >= 0 ? (r[idx[i]] == null ? '' : r[idx[i]]) : ''; });
    return o;
  }).filter(o => cols.some(([, k]) => String(o[k]).trim() !== ''));
  return { list, missing, found: idx.filter((x, i) => x >= 0 && cols[i][2] !== 'ref').length };
}
function coerceCustomer(o, errs) {
  const c = {};
  const s = k => String(o[k] == null ? '' : o[k]).trim();
  c.id = s('id'); c.name = s('name');
  if (!c.name) errs.push('客戶名稱空白');
  const b = parseBool(o.isActive); if (b === null) errs.push(`「服務中」值無法辨識：${s('isActive')}`); c.isActive = !!b;
  for (const k of ['industry', 'owner', 'phone', 'fax', 'regAddress', 'contactAddress', 'website', 'msDomain', 'note']) c[k] = s(k);
  c.taxId = s('taxId').normalize('NFKC').replace(/\s/g, '');
  if (/^\d{1,7}$/.test(c.taxId)) c.taxId = c.taxId.padStart(8, '0'); // Excel 可能去掉開頭的 0
  if (c.taxId && !/^\d{8}$/.test(c.taxId)) errs.push(`統一編號格式錯誤：${c.taxId}`);
  c.capital = s('capital').replace(/[,\s元]/g, ''); if (c.capital && isNaN(Number(c.capital))) errs.push(`登記資本不是數字：${s('capital')}`);
  c.region = normTW(s('region')); if (c.region && !REGIONS.includes(c.region)) errs.push(`地區不在臺灣縣市清單中：${c.region}`);
  if (!c.region) c.region = regionFromAddress(s('regAddress') || s('contactAddress')); // 未填地區時依地址判斷
  for (const k of ['createdDate', 'lastContactDate', 'nextFollowUpDate']) { const d = parseDate(o[k]); if (d === null) errs.push(`日期格式錯誤（${k === 'createdDate' ? '建檔日期' : k === 'lastContactDate' ? '最後聯絡日期' : '下次跟進日期'}）：${s(k)}`); c[k] = d || ''; }
  if (!c.createdDate) c.createdDate = todayStr();
  const a = s('archived'); c.archived = ['已封存', '是', 'true', 'y', '1'].includes(a.toLowerCase());
  c.createdAt = s('createdAt'); c.updatedAt = s('updatedAt'); c.archivedAt = s('archivedAt');
  c._filled = Object.keys(o).filter(k => !k.startsWith('_') && String(o[k] == null ? '' : o[k]).trim() !== ''); // 檔案中有填寫的欄位
  return c;
}
function coerceContact(o, errs) {
  const c = {}; const s = k => String(o[k] == null ? '' : o[k]).trim();
  c.id = s('id'); c.customerId = s('customerId');
  for (const k of CONTACT_FIELDS) c[k] = s(k);
  if (!c.name) errs.push('聯絡人姓名空白');
  if (!c.customerId) errs.push('缺少客戶ID');
  if (c.email && !isEmail(c.email)) errs.push(`電子郵件格式錯誤：${c.email}`);
  c.createdAt = s('createdAt'); c.updatedAt = s('updatedAt');
  return c;
}
function coerceActivity(o, errs) {
  const a = {}; const s = k => String(o[k] == null ? '' : o[k]).trim();
  a.id = s('id'); a.customerId = s('customerId'); a.contactId = s('contactId'); a.contactName = s('contactName');
  a.type = s('type'); if (!ACT_TYPES.includes(a.type)) errs.push(`拜訪類型無法辨識：${a.type || '（空白）'}`);
  const dt = parseDateTime(o.datetime); if (!dt) errs.push(`拜訪日期時間錯誤：${s('datetime') || '（空白）'}`); a.datetime = dt || '';
  a.content = s('content');
  const nf = parseDate(o.nextFollowUpDate); if (nf === null) errs.push(`下次跟進日期錯誤：${s('nextFollowUpDate')}`); a.nextFollowUpDate = nf || '';
  if (!a.customerId) errs.push('缺少客戶ID');
  a.createdAt = s('createdAt'); a.updatedAt = s('updatedAt');
  return a;
}

async function exportCustomersCSV() {
  await Store.loadCustomers();
  const incl = await confirmDialog('是否包含「已封存」的客戶？', { okText: '包含封存客戶', cancelText: '只匯出使用中客戶' });
  const list = Store.customers.filter(c => incl || !c.archived).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  const rows = toRows('customers', list, () => '');
  const ok = await guard(() => saveFile(new Blob([toCSV(rows)], { type: 'text/csv;charset=utf-8' }), `CRM客戶_${stamp()}.csv`, 'CSV 檔', 'text/csv', '.csv'));
  if (ok) toast(`已匯出 ${list.length} 筆客戶 CSV`);
}

/* ---------- Excel 備份匯入 ---------- */
async function importBackupFlow(file) {
  let book;
  try { book = await readXlsx(await file.arrayBuffer()); }
  catch (e) { return toast('無法讀取檔案：' + errMsg(e), 'err'); }
  const errors = []; const warn = [];
  let parsed = {};
  if (book[COMBINED_SHEET] && !book[SHEET_NAMES.customers]) {
    parsed = combinedToParsed(book[COMBINED_SHEET], errors, warn);
    if (!parsed) return;
  } else {
    if (!book[SHEET_NAMES.customers]) return toast(`檔案中找不到「${COMBINED_SHEET}」或「客戶」工作表，請使用本系統的匯入範本或備份檔。`, 'err');
    for (const kind of ['customers', 'contacts', 'activities']) {
      const rows = book[SHEET_NAMES[kind]];
      if (!rows) { if (kind !== 'customers') warn.push(`找不到「${SHEET_NAMES[kind]}」工作表，視為無資料`); parsed[kind] = { list: [], missing: [], found: 0 }; continue; }
      parsed[kind] = rowsToObjects(rows, COLS[kind]);
      if (parsed[kind].missing.length) warn.push(`「${SHEET_NAMES[kind]}」缺少欄位：${parsed[kind].missing.join('、')}`);
    }
  }
  const metaRows = book[SHEET_NAMES.meta] || [];
  const meta = {}; metaRows.slice(1).forEach(r => { meta[r[0]] = r[1]; });
  if (meta['資料結構版本'] && Number(meta['資料結構版本']) > APP.schemaVersion) return toast('此備份來自較新版本的系統，請使用新版 crm.html 匯入。', 'err');
  if (!parsed.customers.list.length && !parsed.contacts.list.length) return toast(errors.length ? '檔案中沒有可匯入的資料：' + errors.slice(0, 3).join('；') : '檔案中沒有任何客戶資料', 'warn');
  const valid = { customers: [], contacts: [], activities: [] };
  // 匯入範本中的「客戶ID」可以是自訂代號（例如 C001），只用來對應聯絡人與活動；
  // 寫入系統時一律改用系統產生的唯一識別碼。
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const custMap = new Map(), ctMap = new Map();
  for (const o of parsed.customers.list) {
    const errs = []; const c = coerceCustomer(o, errs);
    const src = c.id;
    if (src && custMap.has(src)) errs.push('客戶ID 在檔案中重複');
    if (errs.length) { errors.push(`客戶 第 ${o._row} 列（${c.name || '未命名'}）：${errs.join('；')}`); continue; }
    c.id = src && UUID_RE.test(src) ? src : uid();
    if (src) custMap.set(src, c.id);
    c._row = o._row; valid.customers.push(c);
  }
  for (const o of parsed.contacts.list) {
    const errs = []; const c = coerceContact(o, errs);
    if (c.customerId && !custMap.has(c.customerId)) errs.push(`找不到對應的客戶（客戶ID「${c.customerId}」不在「客戶」工作表中，或該客戶列有錯誤）`);
    const src = c.id;
    if (src && ctMap.has(src)) errs.push('聯絡人ID 在檔案中重複');
    if (errs.length) { errors.push(`聯絡人 第 ${o._row} 列（${c.name || '未命名'}）：${errs.join('；')}`); continue; }
    c.customerId = custMap.get(c.customerId);
    c.id = src && UUID_RE.test(src) ? src : uid();
    if (src) ctMap.set(src, c.id);
    valid.contacts.push(c);
  }
  const actIds = new Set();
  for (const o of parsed.activities.list) {
    const errs = []; const a = coerceActivity(o, errs);
    if (a.customerId && !custMap.has(a.customerId)) errs.push(`找不到對應的客戶（客戶ID「${a.customerId}」不在「客戶」工作表中，或該客戶列有錯誤）`);
    if (a.id && actIds.has(a.id)) errs.push('活動ID 在檔案中重複');
    if (errs.length) { errors.push(`業務活動 第 ${o._row} 列：${errs.join('；')}`); continue; }
    a.customerId = custMap.get(a.customerId);
    a.contactId = a.contactId && ctMap.has(a.contactId) ? ctMap.get(a.contactId) : '';
    if (!a.contactId && a.contactName) { // 依姓名自動連結同一客戶的聯絡人
      const m = valid.contacts.find(x => x.customerId === a.customerId && x.name === a.contactName);
      if (m) a.contactId = m.id;
    }
    if (!a.id || !UUID_RE.test(a.id)) a.id = uid();
    actIds.add(a.id); valid.activities.push(a);
  }
  // SI 專案（V1.2 起的備份才有）
  const si = parseSIBackup(book, custMap, errors);
  valid.projects = si.projects; valid.meetings = si.meetings; valid.todos = si.todos;
  await Store.loadCustomers();
  const current = await snapshot();
  // 與現有資料比對重複
  const byId = new Map(current.customers.map(c => [c.id, c]));
  const dups = [];
  for (const c of valid.customers) {
    let ex = byId.get(c.id), why = '客戶ID 相同';
    if (!ex && c.taxId) { ex = current.customers.find(x => x.taxId === c.taxId); why = '統一編號相同'; }
    if (!ex) { const n = normName(c.name); ex = current.customers.find(x => normName(x.name) === n); why = '公司名稱相同'; }
    if (ex) dups.push({ c, ex, why, action: 'skip' });
  }
  const total = { customers: parsed.customers.list.length, contacts: parsed.contacts.list.length, activities: parsed.activities.list.length };
  const m = openModal({
    title: '匯入 Excel 備份：預覽', size: 'wide',
    body: `
      ${parsed.combined ? `<div class="notice info small">偵測到「${COMBINED_SHEET}」匯入範本：每一列為一位聯絡人，相同統一編號或客戶名稱的列會合併為同一家客戶。</div>` : ''}
      <p class="small muted" style="margin-top:0">檔案：${esc(file.name)}${meta['匯出時間'] ? `｜備份時間：${esc(meta['匯出時間'])}` : ''}${meta['資料結構版本'] ? `｜資料結構版本：${esc(meta['資料結構版本'])}` : ''}</p>
      <div class="stat-row">
        <div class="stat ok"><b>${valid.customers.length}</b>客戶可匯入（共 ${total.customers}）</div>
        <div class="stat ok"><b>${valid.contacts.length}</b>聯絡人可匯入（共 ${total.contacts}）</div>
        ${parsed.combined ? '' : `<div class="stat ok"><b>${valid.activities.length}</b>活動可匯入（共 ${total.activities}）</div>`}
        ${si.present ? `<div class="stat ok"><b>${valid.projects.length}</b>SI 專案（會議 ${valid.meetings.length}、待辦 ${valid.todos.length}）</div>` : ''}
        <div class="stat bad"><b>${errors.length}</b>失敗列數</div>
        <div class="stat dup"><b>${dups.length}</b>與現有客戶重複</div></div>
      ${warn.length ? `<div class="notice warn">${warn.map(esc).join('<br>')}</div>` : ''}
      ${errors.length ? `<div class="field"><label>錯誤原因（這些列不會匯入）</label><ul class="err-list">${errors.slice(0, 300).map(e => `<li>${esc(e)}</li>`).join('')}${errors.length > 300 ? `<li>…另有 ${errors.length - 300} 筆</li>` : ''}</ul></div>` : ''}
      <div class="field" style="margin-top:14px"><label>欄位對應</label><p class="small muted" style="margin:0">依標題列自動對應：${Object.keys(COLS).filter(k => !(parsed.combined && k === 'activities')).map(k => `${SHEET_NAMES[k]}（已對應 ${parsed[k].found || 0} 欄）`).join('、')}</p></div>
      <div class="field" style="margin-top:14px"><label>匯入模式</label>
        <div class="seg"><label><input type="radio" name="impMode" value="merge" checked><span>新增匯入（合併）</span></label><label><input type="radio" name="impMode" value="restore"><span>完整還原（取代全部）</span></label></div></div>
      <div id="modeBox" style="margin-top:12px"></div>
      <div class="field" style="margin-top:12px"><label>預覽（前 20 位客戶）</label><div class="scroll-box"><table class="list"><thead><tr><th>列</th><th>客戶名稱</th><th>統編</th><th>服務中</th><th>地區</th><th>封存</th></tr></thead><tbody>
        ${valid.customers.slice(0, 20).map(c => `<tr><td>${c._row}</td><td>${esc(c.name)}</td><td>${esc(c.taxId)}</td><td>${c.isActive ? '是' : '否'}</td><td>${esc(c.region)}</td><td>${c.archived ? '是' : ''}</td></tr>`).join('')}</tbody></table></div></div>`,
    footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="doImp">開始匯入</button>`
  });
  const box = $('#modeBox', m.el);
  const drawMode = () => {
    const mode = $('input[name=impMode]:checked', m.el).value;
    if (mode === 'merge') {
      box.innerHTML = dups.length ? `<div class="notice warn">有 ${dups.length} 位客戶與現有資料重複，請選擇處理方式。「更新」會以檔案中<b>有填寫的欄位</b>覆蓋該客戶資料（空白欄位保留現有資料），並合併其聯絡人與活動；「略過」則不匯入該客戶及其聯絡人、活動。</div>
        <div class="row" style="margin-bottom:8px"><button class="btn sm" id="allSkip">全部略過</button><button class="btn sm" id="allUpd">全部更新</button></div>
        <div class="scroll-box"><table class="list"><thead><tr><th>備份中的客戶</th><th>現有客戶</th><th>比對依據</th><th>處理</th></tr></thead><tbody>
        ${dups.map((d, i) => `<tr><td>${esc(d.c.name)}</td><td>${esc(d.ex.name)}${d.ex.archived ? '（已封存）' : ''}</td><td>${esc(d.why)}</td><td><select class="input" data-dup="${i}" style="min-height:34px;padding:4px 8px"><option value="skip"${d.action === 'skip' ? ' selected' : ''}>略過</option><option value="update"${d.action === 'update' ? ' selected' : ''}>更新</option></select></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="notice ok">沒有與現有客戶重複的資料，將全部以新增方式匯入。</div>';
      $$('[data-dup]', box).forEach(s => s.addEventListener('change', () => { dups[Number(s.dataset.dup)].action = s.value; }));
      const as = $('#allSkip', box), au = $('#allUpd', box);
      if (as) as.addEventListener('click', () => { dups.forEach(d => { d.action = 'skip'; }); drawMode(); });
      if (au) au.addEventListener('click', () => { dups.forEach(d => { d.action = 'update'; }); drawMode(); });
    } else {
      box.innerHTML = `<div class="notice danger"><b>⚠ 完整還原會刪除目前裝置中的全部資料</b>，再以備份檔內容取代：<br>目前有客戶 ${current.customers.length} 筆、聯絡人 ${current.contacts.length} 筆、業務活動 ${current.activities.length} 筆、SI 專案 ${current.projects.length} 個將被移除。<br>還原後將有客戶 ${valid.customers.length} 筆、聯絡人 ${valid.contacts.length} 筆、業務活動 ${valid.activities.length} 筆、SI 專案 ${valid.projects.length} 個。${!si.present && current.projects.length ? '<br><b>此備份檔不含 SI 專案資料（舊版備份），還原後目前的 SI 專案將被清除。</b>' : ''}${errors.length ? `<br>備份中有 ${errors.length} 列錯誤，這些列不會被還原。` : ''}</div>
        <div class="row"><button class="btn" id="preBk">⬇ 先匯出目前資料備份</button>
        <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="ackRestore" style="width:20px;height:20px">我了解目前資料將被取代</label></div>`;
      $('#preBk', box).addEventListener('click', async () => { const r = await guard(() => exportBackup()); if (r) toast('目前資料已匯出備份'); });
    }
  };

    await Promise.all(['customers', 'contacts', 'activities', 'projects', 'meetings', 'todos'].map(n => req(s[n].clear())));
    for (const p of valid.projects || []) s.projects.put(fillTimes(stripTmp(p), now));
    for (const m of valid.meetings || []) s.meetings.put(fillTimes(stripTmp(m), now));
    for (const t of valid.todos || []) s.todos.put(fillTimes(stripTmp(t), now));
    for (const c of valid.customers) s.customers.put(fillTimes(Object.assign(blankCustomer(), stripTmp(c)), now));
    for (const c of valid.contacts) s.contacts.put(fillTimes(stripTmp(c), now));
    for (const a of valid.activities) s.activities.put(fillTimes(stripTmp(a), now));

function mergeImport(valid, dups) {

  return DB.tx(['customers', 'contacts', 'activities', 'projects', 'meetings', 'todos'], 'readwrite', async s => {

      if (d) {

      const cid = idMap.get(ct.customerId);
      const data = Object.assign(stripTmp(ct), { customerId: cid });
      let ex = await req(s.contacts.get(ct.id));
      if (ex && ex.customerId !== cid) { ex = null; data.id = uid(); }
      if (!ex) {
        const sib = await req(s.contacts.index('customerId').getAll(cid));
        ex = sib.find(x => x.name === data.name && ((data.email && x.email === data.email) || (data.phone && x.phone === data.phone) || (data.mobile && x.mobile === data.mobile) || (!data.email && !data.phone && !data.mobile)));

      if (skipped.has(a.customerId) || !idMap.has(a.customerId)) { r.aSkip++; continue; }

      const data = Object.assign(stripTmp(a), { customerId: cid, contactId: a.contactId ? (ctMap.get(a.contactId) || '') : '' });
      let ex = await req(s.activities.get(a.id));
      if (ex && ex.customerId !== cid) { ex = null; data.id = uid(); }
      if (!ex) {
        const sib = await req(s.activities.index('customerId').getAll(cid));
        ex = sib.find(x => x.datetime === data.datetime && x.type === data.type && x.content === data.content);
        if (ex) data.id = ex.id;
      }

      else { s.activities.put(fillTimes(data, now)); r.aAdd++; }

    }

}

    }
    if (g && c.taxId && byTax.get(c.taxId) === g && normName(g.raw.name) !== nn) {
      errors.push(`第 ${o._row} 列（${c.name}）：統一編號 ${c.taxId} 與第 ${g.row} 列「${g.raw.name}」相同，但客戶名稱不同，此列未匯入`); continue;
    }
    if (!g) { g = { id: 'G' + (groups.length + 1), row: o._row, raw: { _row: o._row }, from: {} }; groups.push(g); }
    for (const k of custKeys) { // 合併公司欄位：以第一個有填寫的值為準
      const v = String(raw[k] == null ? '' : raw[k]).trim();
      if (!v) continue;
      const cur = String(g.raw[k] == null ? '' : g.raw[k]).trim();
      if (!cur) { g.raw[k] = raw[k]; g.from[k] = o._row; }
      else if (k !== 'name' && cur !== v) warn.push(`第 ${o._row} 列「${(COMBINED_COLS.find(x => x[1] === k) || [k])[0]}」與第 ${g.from[k]} 列不同，以第 ${g.from[k]} 列為準（${c.name}）`);
    }
    if (c.taxId) byTax.set(c.taxId, g);
    byName.set(nn, g);
    if (ct.name) contacts.push(Object.assign({ _row: o._row, id: '', customerId: g.id }, ct));
  }
  const customers = groups.map(g => Object.assign({ id: g.id }, g.raw));
  return {
    customers: { list: customers, missing: [], found: found - COMBINED_COLS.filter(c => c[1].startsWith('ct_') && !missing.includes(c[0])).length },
    combined: true,
    contacts: { list: contacts, missing: [], found: COMBINED_COLS.filter(c => c[1].startsWith('ct_') && !missing.includes(c[0])).length },
    activities: { list: [], missing: [], found: 0 }
  };
}

/* ---------- 解析備份中的 SI 專案工作表 ---------- */
function parseSIBackup(book, custMap, errors) {
  const out = { present: !!book[SI_SHEETS.projects], projects: [], meetings: [], todos: [] };
  if (!out.present) return out;
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const rows = k => book[SI_SHEETS[k]] ? rowsToObjects(book[SI_SHEETS[k]], SI_COLS[k]).list : [];
  const s = (o, k) => String(o[k] == null ? '' : o[k]).trim();
  const statusOf = v => { const x = PJ_STATUS.find(st => st.t === v || st.k === v); return x ? x.k : null; };
  const pMap = new Map();
  for (const o of rows('projects')) {
    const errs = [];
    const p = PJ.blank();
    for (const [, k] of SI_COLS.projects) if (!k.startsWith('_') && k !== 'statusHistory') p[k] = s(o, k);
    p.status = statusOf(s(o, 'status')); if (!p.status) errs.push(`專案狀態無法辨識：${s(o, 'status')}`);
    if (!p.name) errs.push('專案名稱空白');
    if (!custMap.has(p.customerId)) errs.push('找不到對應的客戶（客戶ID 不在「客戶」工作表中或該列有錯誤）');
    p.announced = parseBool(o.announced) === true;
    p.amount = p.amount === '' ? '' : parseMoney(p.amount); if (p.amount !== '' && isNaN(p.amount)) errs.push('合約總金額不是數字');
    for (const k of ['announceDate', 'startDate', 'endDate', 'nextFollowUpDate', 'acceptanceDate', 'contractEndDate']) { const d = parseDate(o[k]); if (d === null) errs.push(`日期格式錯誤：${s(o, k)}`); p[k] = d || ''; }
    try { p.statusHistory = s(o, 'statusHistory') ? JSON.parse(s(o, 'statusHistory')) : []; if (!Array.isArray(p.statusHistory)) p.statusHistory = []; } catch (e) { p.statusHistory = []; }
    if (errs.length) { errors.push(`SI專案 第 ${o._row} 列（${p.name || '未命名'}）：${errs.join('；')}`); continue; }
    const src = p.id; p.id = UUID_RE.test(src) ? src : uid(); p.customerId = custMap.get(p.customerId); p.costs = []; p.payments = [];
    pMap.set(src || p.id, p); out.projects.push(p);
  }
  for (const o of rows('costs')) {
    const p = pMap.get(s(o, 'projectId')); if (!p) { errors.push(`SI專案成本 第 ${o._row} 列：找不到對應的專案`); continue; }
    p.costs.push({ id: s(o, 'id') || uid(), vendor: s(o, 'vendor'), item: s(o, 'item'), qty: Number(s(o, 'qty')) || 0, unitCost: parseMoney(s(o, 'unitCost')) || 0, quoted: parseBool(o.quoted) === true, quoteDate: parseDate(o.quoteDate) || '', note: s(o, 'note') });
  }
  for (const o of rows('payments')) {
    const p = pMap.get(s(o, 'projectId')); if (!p) { errors.push(`SI專案收款 第 ${o._row} 列：找不到對應的專案`); continue; }
    p.payments.push({ id: s(o, 'id') || uid(), term: s(o, 'term'), amount: parseMoney(s(o, 'amount')) || 0, dueDate: parseDate(o.dueDate) || '', paidDate: parseDate(o.paidDate) || '', invoiceNo: s(o, 'invoiceNo'), note: s(o, 'note') });
  }
  const mMap = new Map();
  for (const o of rows('meetings')) {
    const p = pMap.get(s(o, 'projectId')); const dt = parseDateTime(o.datetime);
    if (!p || !dt) { errors.push(`SI會議紀錄 第 ${o._row} 列：${!p ? '找不到對應的專案' : '會議時間錯誤'}`); continue; }
    const m = { id: UUID_RE.test(s(o, 'id')) ? s(o, 'id') : uid(), projectId: p.id, datetime: dt, title: s(o, 'title'), location: s(o, 'location'), attendees: s(o, 'attendees'), notes: String(o.notes == null ? '' : o.notes), createdAt: s(o, 'createdAt'), updatedAt: s(o, 'updatedAt') };
    mMap.set(s(o, 'id'), m.id); out.meetings.push(m);
  }
  for (const o of rows('todos')) {
    const p = pMap.get(s(o, 'projectId'));
    if (!p || !s(o, 'text')) { errors.push(`SI待辦事項 第 ${o._row} 列：${!p ? '找不到對應的專案' : '待辦內容空白'}`); continue; }
    out.todos.push({ id: UUID_RE.test(s(o, 'id')) ? s(o, 'id') : uid(), projectId: p.id, meetingId: mMap.get(s(o, 'meetingId')) || '', text: s(o, 'text'), owner: s(o, 'owner'), dueDate: parseDate(o.dueDate) || '',
      done: parseBool(o.done) === true, doneAt: s(o, 'doneAt'), key: s(o, 'key') || normKey(s(o, 'text')), createdAt: s(o, 'createdAt'), updatedAt: s(o, 'updatedAt') });
  }
  return out;
}
